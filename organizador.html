function desenharLado() {
  $("qtdTodas").textContent = contarAtivas();
  $("qtdSemTag").textContent = semTag();
  $("qtdArq").textContent = contarArq();
  document.querySelectorAll("[data-vista]").forEach((b) => {
    const v = b.dataset.vista;
    b.classList.toggle("on", !filtroCol
      && ((v === "todas" && filtro === "") || (v === "semtag" && filtro === "__sem")
          || (v === "arquivadas" && filtro === "__arq")));
  });

  const lista = todasColecoes();
  $("qtdCol").textContent = lista.length || "";
  $("listaCol").innerHTML = lista.map((c) =>
    '<button class="item' + (filtroCol === c.nome ? " on" : "") + '" data-col="' + esc(c.nome) + '" draggable="true">'
    + '<span class="pega" aria-hidden="true">' + SVG_PEGA + '</span>'
    + '<span class="rotulo">' + esc(c.nome) + '</span>'
    + '<span class="qtd">' + c.n + '</span>'
    + '<span class="engrenagem" data-menucol="' + esc(c.nome) + '" role="button" tabindex="0"'
    + ' aria-label="Opções de ' + esc(c.nome) + '">' + SVG_ENGRENAGEM + '</span></button>').join("");

  const fora = colecoesOcultas();
  $("excluidas").innerHTML = fora.length
    ? '<div class="secao-bt" style="padding-bottom:4px"><span class="rotulo">Excluídas do site</span></div>'
      + fora.map((n) => '<div class="item oculta-linha"><span class="rotulo">' + esc(n) + '</span>'
        + '<button class="qtd" data-restaurar="' + esc(n) + '" style="cursor:pointer">restaurar</button></div>').join("")
    : "";

  $("qtdTag").textContent = ordemTags.length || "";
  $("listaTag").innerHTML = ordemTags.map((t) =>
    '<button class="item' + (filtro === t ? " on" : "") + '" data-tag="' + esc(t) + '" draggable="true">'
    + '<span class="pega" aria-hidden="true">' + SVG_PEGA + '</span>'
    + '<span class="rotulo">' + esc(t) + '</span>'
    + '<span class="qtd">' + contarTag(t) + '</span>'
    + '<span class="engrenagem" data-menutag="' + esc(t) + '" role="button" tabindex="0"'
    + ' aria-label="Opções de ' + esc(t) + '">' + SVG_ENGRENAGEM + '</span></button>').join("");

  /* clique, engrenagem, botão direito e arrastar - nas duas listas */
  const ligarLista = (sel, aoClicar, menu, aoSoltar) => {
    document.querySelectorAll(sel).forEach((b) => {
      const nome = b.dataset.col || b.dataset.tag;
      b.onclick = (e) => { if (e.target.closest("[data-menucol],[data-menutag]")) return; aoClicar(nome); };
      b.oncontextmenu = (e) => { e.preventDefault(); menu(nome, e); };
      b.ondragstart = (e) => { e.dataTransfer.setData("text/plain", sel + nome); b.classList.add("arrastando"); };
      b.ondragend = () => { b.classList.remove("arrastando"); desenharLado(); };
      b.ondragover = (e) => { e.preventDefault(); b.classList.add("alvo"); };
      b.ondragleave = () => b.classList.remove("alvo");
      b.ondrop = (e) => {
        e.preventDefault(); b.classList.remove("alvo");
        const d = String(e.dataTransfer.getData("text/plain") || "");
        if (d.indexOf(sel) !== 0) return;
        aoSoltar(d.slice(sel.length), nome);
      };
    });
  };
  ligarLista("[data-col]", (n) => { filtroCol = filtroCol === n ? "" : n; filtro = ""; mostrar = "fotos"; desenhar(); },
    menuDaColecao,
    (de, para) => {
      const ordem = todasColecoes().map((c) => c.nome);
      const i = ordem.indexOf(de), j = ordem.indexOf(para);
      if (i < 0 || j < 0 || i === j) return;
      moverColecao(de, j - i > 0 ? 1 : -1);
      /* mais de uma casa: repete até chegar */
      let atualI = todasColecoes().map((c) => c.nome).indexOf(de);
      while (atualI !== j && atualI >= 0) {
        moverColecao(de, j - atualI > 0 ? 1 : -1);
        const novo = todasColecoes().map((c) => c.nome).indexOf(de);
        if (novo === atualI) break;
        atualI = novo;
      }
      desenhar();
    });
  ligarLista("[data-tag]", (t) => { filtro = filtro === t ? "" : t; desenhar(); },
    menuDaTag,
    (de, para) => {
      const i = ordemTags.indexOf(de), j = ordemTags.indexOf(para);
      if (i < 0 || j < 0 || i === j) return;
      ordemTags.splice(i, 1);
      ordemTags.splice(j, 0, de);
      salvar(); desenhar();
    });
  document.querySelectorAll("[data-menucol]").forEach((g) => {
    g.onclick = (e) => { e.stopPropagation(); menuDaColecao(g.dataset.menucol, g); };
  });
  document.querySelectorAll("[data-menutag]").forEach((g) => {
    g.onclick = (e) => { e.stopPropagation(); menuDaTag(g.dataset.menutag, g); };
  });
  document.querySelectorAll("[data-restaurar]").forEach((b) => {
    b.onclick = () => {
      restaurarColecao(b.dataset.restaurar);
      mostrarEstado("“" + b.dataset.restaurar + "” voltou para o site", "ok");
      desenhar();
    };
  });
}

/* ---------- BARRA DE CIMA ---------- */
function baseDaVista() {
  if (filtro === "__arq") return itens.filter(ehArq).concat(arquivadasOrfas());
  const vivas = itens.filter((x) => !ehArq(x) && !ehSeguidora(x));
  return filtroCol ? vivas.filter((x) => colecoesDe(x).includes(filtroCol)) : vivas;
}
function visiveis() {
  let l = baseDaVista();
  if (mostrar === "carrosseis") l = l.filter((x) => paginas(x).length > 1);
  if (filtro === "__sem") l = l.filter((x) => !val(x, "tag"));
  else if (filtro && filtro !== "__arq") l = l.filter((x) => val(x, "tag") === filtro);
  const t = busca.trim().toLowerCase();
  if (t) {
    l = l.filter((x) => {
      const txt = [val(x, "name"), val(x, "phrase"), valGrupo(x, "name"), valGrupo(x, "phrase"),
        val(x, "tag"), colecoesDe(x).join(" "), x.caminho, faixaDeAnos(x), val(x, "year")].join(" ");
      return txt.toLowerCase().includes(t);
    });
  }
  return l;
}
function desenharAlternador() {
  const base = baseDaVista();
  const nCar = base.filter((x) => paginas(x).length > 1).length;
  const nCol = todasColecoes().length;
  const op = [["fotos", "Fotos", base.length]];
  if (!filtroCol && filtro !== "__arq") op.push(["colecoes", "Coleções", nCol]);
  op.push(["carrosseis", "Carrosséis", nCar]);
  if (mostrar === "colecoes" && (filtroCol || filtro === "__arq")) mostrar = "fotos";
  $("alternador").innerHTML = op.map(([k, r, n]) =>
    '<button class="' + (mostrar === k ? "on" : "") + '" data-m="' + k + '" aria-pressed="' + (mostrar === k) + '">'
    + r + ' <span class="n">' + n + '</span></button>').join("");
  $("alternador").querySelectorAll("[data-m]").forEach((b) => {
    b.onclick = () => { mostrar = b.dataset.m; desenhar(); };

}
function desenharChips() {
  const base = baseDaVista();
  const conta = (t) => base.filter((x) => val(x, "tag") === t).length;
  const nSem = base.filter((x) => !val(x, "tag")).length;

      + esc(filtroCol) + ' <span class="n">×</span></button>');
  }
  f.push('<button class="chip' + (filtro === "" || filtro === "__arq" ? " on" : "") + '" data-f="">Todas'
    + ' <span class="n">' + base.length + '</span></button>');

    f.push('<button class="chip' + (filtro === "__sem" ? " on" : "") + '" data-f="__sem">Sem tag'
      + ' <span class="n">' + nSem + '</span></button>');

    if (!conta(t)) return;
    f.push('<button class="chip' + (filtro === t ? " on" : "") + '" data-f="' + esc(t) + '">'
      + esc(t) + ' <span class="n">' + conta(t) + '</span></button>');

/* SEM BOTÃO DE "SELECIONAR": marcar é clicar na bolinha da foto.
   Ela: "se você clicar na bolinha de cada imagem já dá a função dele".
   Os ícones de ação aparecem sozinhos quando existe foto marcada. */
function atualizarSel() {
  $("contaSel").textContent = selecao.size;
  $("acoesSel").hidden = selecao.size === 0;
}
function marcar(caminho) {
  if (selecao.has(caminho)) selecao.delete(caminho); else selecao.add(caminho);
  desenhar();
}
async function criarColecaoDasMarcadas() {
  const n = selecao.size;
  if (!n) return;
  const nome = await perguntar("Nova coleção",
    "As " + n + (n === 1 ? " foto marcada entra" : " fotos marcadas entram") + " nela. Elas continuam no All.",
    { dica: "Nome da coleção" });
  if (!nome) return;
  const limpo = criarColecao(nome);
  if (!limpo) return;
  [...selecao].map(acharItem).filter(Boolean).forEach((x) => {
    const l = colecoesDe(x);
    if (!l.includes(limpo)) definirColecoes(x.caminho, l.concat([limpo]));
  });
  selecao.clear();
  salvar(); desenhar();
  mostrarEstado("“" + limpo + "” criada com " + n + (n === 1 ? " foto" : " fotos"), "ok");
}
/* JUNTAR DUAS FOTOS ARRASTANDO UMA NA OUTRA.
   A foto onde ela SOLTA é a capa - é o gesto de "pôr dentro desta".
   A ordem é escrita aqui na mão, e não pelo `agruparCarrossel`, que
   tira a ordem da grade: arrastando, quem manda é o gesto dela. */
async function juntarArrastando(capa, outra) {
  if (!acharItem(capa) || capa === outra) return;
  const nomeCapa = val(acharItem(capa), "name") || capa.split("/").pop();
  const ok = await perguntar("Juntar num carrossel?",
    "As duas viram um card só, com 2 páginas. A capa fica sendo “" + nomeCapa
    + "”, a foto onde você soltou. Nenhuma foto é apagada.");
  if (!ok) return;
  soltarGrupo(capa); soltarGrupo(outra);
  editar(capa, "carrossel", [outra]);
  editar(outra, "carrosselDe", capa);
  selecao.clear();
  salvar(); desenhar();
  mostrarEstado("carrossel de 2 fotos · a capa é “" + nomeCapa + "”", "ok");
}

/* ---------- A GRADE ---------- */
function cartaoDaColecao(c) {
  const fotos = itens.filter((x) => ativa(x) && colecoesDe(x).includes(c.nome)).slice(0, 9);
  const quadros = [];
  for (let i = 0; i < 9; i++) {
    const f = fotos[i];
    quadros.push(f && (f.image || f.video)
      ? '<img src="' + esc(f.image || f.video) + '" alt="" loading="lazy">'
      : '<span class="buraco"></span>');
  }
  return '<div class="cartao"><div class="mosaico" data-abrircol="' + esc(c.nome) + '" role="button" tabindex="0"'
    + ' aria-label="Abrir ' + esc(c.nome) + '">' + quadros.join("") + '</div>'
    + '<div class="linha-nome"><div class="txt"><div class="nome">' + esc(c.nome) + '</div>'
    + '<div class="meta">' + (c.n ? c.n + (c.n === 1 ? " foto" : " fotos") : "vazia — não aparece no site")
    + (c.pasta ? " · pasta" : "") + '</div></div>'
    + '<button class="engrenagem" data-menucolgrade="' + esc(c.nome) + '" aria-label="Opções de '
    + esc(c.nome) + '">' + SVG_ENGRENAGEM + '</button></div></div>';
}

function desenharGrade() {
  $("grade").style.gridTemplateColumns = "repeat(auto-fill, minmax(" + ZOOMS[zoom] + "px, 1fr))";
  $("btMenos").disabled = zoom === 0;
  $("btMais").disabled = zoom === ZOOMS.length - 1;

  /* --- as coleções, em mosaico --- */
  if (mostrar === "colecoes" && !filtroCol && filtro !== "__arq") {
    const cs = todasColecoes();
    $("tituloVista").textContent = "Todas as coleções";
    $("conta").textContent = cs.length + (cs.length === 1 ? " coleção" : " coleções");
    $("grade").innerHTML = cs.length ? cs.map(cartaoDaColecao).join("")
      : '<div class="vazio">Nenhuma coleção ainda.</div>';
    $("grade").querySelectorAll("[data-abrircol]").forEach((b) => {
      b.onclick = () => { filtroCol = b.dataset.abrircol; mostrar = "fotos"; filtro = ""; desenhar(); };
      b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.onclick(); } };
      b.oncontextmenu = (e) => { e.preventDefault(); menuDaColecao(b.dataset.abrircol, e); };
    });
    $("grade").querySelectorAll("[data-menucolgrade]").forEach((g) => {
      g.onclick = (e) => { e.stopPropagation(); menuDaColecao(g.dataset.menucolgrade, g); };
    });
    return;
  }

  /* --- as fotos --- */
  const l = visiveis();
  $("tituloVista").textContent = filtroCol ? filtroCol
    : filtro === "__arq" ? "Arquivadas"
    : filtro === "__sem" ? "Sem tag"
    : mostrar === "carrosseis" ? "Todos os carrosséis" : "Todas as fotos";
  $("conta").textContent = l.length + (l.length === 1 ? " foto" : " fotos")
    + (mostrar === "carrosseis" ? " em carrosséis" : "");

  $("grade").innerHTML = l.length ? l.map((it) => {
    const seq = paginas(it);
    const ehGrupo = seq.length > 1;
    const t = val(it, "tag");
    const nome = valGrupo(it, "name") || val(it, "name") || it.caminho.split("/").pop();
    const ano = ehGrupo ? (faixaDeAnos(it) || valGrupo(it, "year") || val(it, "year")) : val(it, "year");
    const midia = (u, cls) => (it.video && u === (it.image || it.video) && !it.image)
      ? '<video src="' + esc(u) + '" preload="metadata" muted class="' + cls + '"></video>'
      : '<img src="' + esc(u) + '" alt="" loading="lazy" class="' + cls + '">';
    const marca = '<span class="marca-sel" data-marcar="' + esc(it.caminho) + '" role="button" tabindex="0"'
      + ' aria-label="Marcar">' + SVG_CHECK + '</span>';
    const selo = ehArq(it) ? '<span class="selo arq">arquivada</span>'
      : ehGrupo ? '<span class="selo">' + seq.length + ' fotos</span>'
      : (!t ? '<span class="selo sem">sem tag</span>' : "");
    const corpo = ehGrupo
      ? '<div class="folha f1">' + midia(seq[1].url, "") + '</div>'
        + '<div class="folha f2">' + midia((seq[2] || seq[0]).url, "") + '</div>'
        + '<div class="folha f3">' + midia(seq[0].url, "") + '</div>'
        + '<span class="entrar">abrir carrossel</span>'
      : midia(it.image || it.video, "");
    return '<div class="cartao" data-foto="' + esc(it.caminho) + '">'
      + '<div class="moldura' + (ehGrupo ? " pilha" : "") + (selecao.has(it.caminho) ? " marcada" : "")
      + '" tabindex="0" role="button" draggable="true" aria-label="Abrir ' + esc(nome) + '">'
      + marca + selo + corpo + '</div>'
      + '<div class="nome">' + esc(nome) + '</div>'
      + '<div class="meta"><span class="ponto"></span>' + esc(t || "sem tag")
      + (ano ? " · " + esc(ano) : "")
      + (colecoesDe(it).length ? " · " + esc(colecoesDe(it).join(", ")) : "") + '</div></div>';
  }).join("") : '<div class="vazio">Nada aqui com esse filtro.</div>';

  $("grade").querySelectorAll("[data-foto]").forEach((c) => {
    const caminho = c.dataset.foto;
    const mold = c.querySelector(".moldura");
    const circ = c.querySelector("[data-marcar]");
    if (circ) {
      circ.onclick = (e) => { e.stopPropagation(); marcar(caminho); };
      circ.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); marcar(caminho); } };
    }
    mold.onclick = () => abrirPainel(caminho);
    mold.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirPainel(caminho); }
    };
    mold.ondragstart = (e) => { e.dataTransfer.setData("text/plain", "foto:" + caminho); e.dataTransfer.effectAllowed = "move"; };
    mold.ondragover = (e) => { e.preventDefault(); mold.classList.add("solta"); };
    mold.ondragleave = () => mold.classList.remove("solta");
    mold.ondrop = (e) => {
      e.preventDefault(); mold.classList.remove("solta");
      const d = String(e.dataTransfer.getData("text/plain") || "");
      if (d.indexOf("foto:") !== 0) return;
      juntarArrastando(caminho, d.slice(5));
    };
    c.oncontextmenu = (e) => {
      e.preventDefault();
      const it = acharItem(caminho);
      if (!it) return;
      const cols = colecoesDe(it);
      abrirMenu(e, [
        { id: "abrir", rotulo: "Abrir", faz: () => abrirPainel(caminho) },
        { id: "marcar", rotulo: selecao.has(caminho) ? "Desmarcar" : "Marcar", faz: () => marcar(caminho) },
      ].concat(cols.length ? [{ id: "col", rotulo: "Ver “" + cols[0] + "”",
        faz: () => { filtroCol = cols[0]; filtro = ""; mostrar = "fotos"; desenhar(); } }] : [])
        .concat(paginas(it).length > 1 ? [{ id: "desagrupa", rotulo: "Desfazer o carrossel",
          faz: () => { selecao.clear(); selecao.add(caminho); desagrupar(); } }] : [])
        .concat(["-", { id: "arq", rotulo: ehArq(it) ? "Desarquivar" : "Arquivar", perigo: !ehArq(it),
          faz: () => { editar(caminho, "archived", ehArq(it) ? false : true); salvar(); desenhar(); } }]));
    };
  });
}

/* ---------- O POP-UP DA FOTO ----------
   Tudo o que o painel antigo tinha, no lugar novo: idioma, textos do
   card (ou do grupo), tag, coleções, botão de info, as páginas do
   carrossel (agora arrastáveis) e os textos de cada página. */
function abrirPainel(caminho) {
  const it = acharItem(caminho);
  if (!it) return;
  if (atual && atual.caminho !== caminho) paginaSel = null;
  atual = it;
  const seq = paginas(it);
  const ehGrupo = seq.length > 1;
  const minhas = colecoesDe(it);
  const cols = todasColecoes().map((c) => c.nome);

  if (ehGrupo && (!paginaSel || !seq.some((x) => x.caminho === paginaSel))) paginaSel = seq[0].caminho;
  const selPag = itens.find((x) => x.caminho === paginaSel);
  const pgSel = seq.find((x) => x.caminho === paginaSel) || {};
  const iSel = seq.findIndex((x) => x.caminho === paginaSel);

  /* o valor de um campo da PÁGINA escolhida: o que ela editou, o que o
     robô publicou naquela página, e só então o item solto */
  const vSel = (campo) => {
    if (idioma !== "en" && (campo === "phrase" || campo === "name")) {
      const e = (edicoes[paginaSel] || {})[idioma] || {};
      if (e[campo] !== undefined) return e[campo] || "";
      const pubPg = (pgSel[idioma] && typeof pgSel[idioma] === "object") ? pgSel[idioma] : {};
      if (pubPg[campo]) return pubPg[campo];
      const pubIt = (selPag && selPag[idioma] && typeof selPag[idioma] === "object") ? selPag[idioma] : {};
      return pubIt[campo] || "";
    }
    const e = edicoes[paginaSel] || {};
    if (e[campo] !== undefined) return e[campo] || "";
    if (pgSel[campo]) return pgSel[campo];
    return selPag ? (selPag[campo] || "") : "";
  };
  const vSelEn = (campo) => {
    const e = edicoes[paginaSel] || {};
    if (e[campo] !== undefined) return e[campo] || "";
    if (pgSel[campo]) return pgSel[campo];
    return selPag ? (selPag[campo] || "") : "";
  };
  const ehTexto = (c) => c === "phrase" || c === "name";
  const leCard = (c) => ehGrupo ? (ehTexto(c) ? valGrupoLingua(it, c) : valGrupo(it, c))
                                : (ehTexto(c) ? valLingua(it, c) : val(it, c));
  const leCardEn = (c) => ehGrupo ? valGrupo(it, c) : val(it, c);
  const idCard = ehGrupo ? { f: "fGrpFrase", n: "fGrpNome", a: "fGrpAno", l: "fGrpLink" }
                         : { f: "fFrase", n: "fNome", a: "fAno", l: "fLink" };
  const infoCardLigada = !desligada(ehGrupo ? valGrupo(it, "noInfo") : val(it, "noInfo"));

  /* --- a foto grande e as páginas --- */
  $("fPalco").innerHTML = it.image
    ? '<img src="' + esc(pgSel.url || it.image) + '" alt="">'
    : '<video src="' + esc(it.video) + '" controls preload="metadata"></video>';
  $("fCaminho").textContent = ehGrupo ? (paginaSel || it.caminho) : it.caminho;
  $("fTitulo").textContent = leCard("name") || it.caminho.split("/").pop();
  $("fTiras").innerHTML = ehGrupo ? seq.map((pg, k) =>
    '<div class="tira' + (pg.caminho === paginaSel ? " on" : "") + '" data-p="' + esc(pg.caminho) + '"'
    + ' data-k="' + k + '" draggable="true" role="button" tabindex="0" title="Arraste para mudar a ordem">'
    + '<img src="' + esc(pg.url) + '" alt="">'
    + (k === 0 ? '<span class="capa-marca">capa</span>' : "") + '</div>').join("") : "";

  /* --- os campos --- */
  /* uma seção que abre e fecha; o que está aberto sobrevive ao redesenho
     (o pop-up se remonta inteiro a cada clique numa página) */
  const secao = (id, nome, resumo, corpoHtml, falta, ajuda) =>
    '<details class="secao"' + (abertas.has(id) ? " open" : "") + ' data-s="' + id + '">'
    + '<summary><span class="seta-s" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24"'
    + ' fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M9 18l6-6-6-6"/></svg></span>'
    + '<span class="nome-s">' + esc(nome) + '</span>'
    + '<span class="resumo-s' + (falta ? " falta" : "") + '">' + esc(resumo) + '</span>'
    + (ajuda ? '<button class="ajuda" data-ajuda="' + id + '" aria-expanded="false"'
        + ' aria-label="O que é isto" title="O que é isto">i</button>' : "")
    + '</summary>' 
    + '<div class="corpo-s">'
    + (ajuda ? '<p class="dica explica" id="explica-' + id + '">' + ajuda + '</p>' : "")
    + corpoHtml + '</div></details>';
  /* o resumo: os campos que JÁ estão preenchidos */
  const cheios = (le, pares) => pares.filter((p) => le(p[0])).map((p) => p[1]);

  /* o nome do campo e o texto de dentro (placeholder), e some quando ela
     escreve; o `aria-label` mantem o nome para quem usa leitor de tela */
  const campoTexto = (id, nome, valor, alto) => '<div class="campo">'
    + (alto
        ? '<textarea id="' + id + '" rows="2" placeholder="' + esc(nome) + '" aria-label="' + esc(nome) + '">'
          + esc(valor) + '</textarea>'
        : '<input type="text" id="' + id + '" value="' + esc(valor) + '" placeholder="' + esc(nome)
          + '" aria-label="' + esc(nome) + '">')
    + '</div>';

  const preenchidos = cheios(leCard, [["phrase", "título"], ["name", "detalhe"],
    ["year", "ano"], ["link", "link"]]);
  const corpoTextos = campoTexto(idCard.f,
        idioma !== "en" ? (leCardEn("phrase") || "Título — o texto grande") : "Título — o texto grande",
        leCard("phrase"), true)
    + campoTexto(idCard.n,
        idioma !== "en" ? (leCardEn("name") || "Detalhe — o pequeno embaixo") : "Detalhe — o pequeno embaixo",
        leCard("name"), false)
    + '<div class="dois-campos">'
      + campoTexto(idCard.a, "Ano", leCard("year"), false)
      + campoTexto(idCard.l, "Link", leCard("link"), false) + '</div>'
    + '<div class="chave-linha"><button class="chave" id="fInfoCard" role="switch" aria-checked="'
      + infoCardLigada + '" aria-label="Botão de info"></button>'
      + '<span class="rotulo-campo">Botão de info</span></div>';

  /* SEM OS ROTULOS "Tag" e "Colecoes": a secao ja se chama assim. A fila
     de cima e a tag (roxa quando escolhida); a de baixo sao as colecoes
     (verdes, e terminam no "+ nova"). O "i" conta isso. */
  const corpoClasse = '<div class="escolhas" id="fTags" role="group" aria-label="Tag">'
    + ordemTags.map((t) => '<button class="escolha' + (val(it, "tag") === t ? " on" : "")
        + '" type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>').join("")
    + '<button class="escolha' + (!val(it, "tag") ? " on" : "") + '" type="button" data-t="">nenhuma</button>'
    + '</div>'
    + '<div class="escolhas" id="fCols" role="group" aria-label="Coleções">'
    + cols.map((c) => '<button class="escolha verde' + (minhas.includes(c) ? " on" : "")
        + '" type="button" data-c="' + esc(c) + '" aria-pressed="' + minhas.includes(c) + '">'
        + esc(c) + '</button>').join("")
    + '<button class="escolha" type="button" id="btNovaColPainel">+ nova</button></div>';

  const corpoPagina = !ehGrupo ? "" :
    campoTexto("fPagFrase",
        idioma !== "en" ? (vSelEn("phrase") || "Título desta foto") : "Título desta foto",
        vSel("phrase"), true)
    + campoTexto("fPagNome",
        idioma !== "en" ? (vSelEn("name") || "Detalhe desta foto") : "Detalhe desta foto",
        vSel("name"), false)
    + '<div class="dois-campos">'
      + campoTexto("fPagAno", valGrupo(it, "year") || val(it, "year") || "Ano", vSel("year"), false)
      + campoTexto("fPagLink", valGrupo(it, "link") || val(it, "link") || "Link", vSel("link"), false)
    + '</div>'
    + '<div class="chave-linha"><button class="chave" id="fInfoPag" role="switch" aria-checked="'
      + (!desligada(vSel("noInfo"))) + '" aria-label="Botão de info desta foto"></button>'
      + '<span class="rotulo-campo">Botão de info desta foto</span></div>';

  const resumoPagina = (vSel("name") || vSel("phrase") || "sem texto")
    + (desligada(vSel("noInfo")) ? " · sem info" : "");

  const corpo = '<div class="linha-idioma"><div class="alternador" id="fIdiomas" role="group"'
    + ' aria-label="Idioma dos textos">' + IDIOMAS.map((lg) =>
      '<button class="' + (idioma === lg[0] ? "on" : "") + '" data-lg="' + lg[0] + '">'
      + lg[1] + '</button>').join("")
    + '</div><button class="ajuda" data-ajuda="idioma" aria-expanded="false"'
    + ' aria-label="O que é isto" title="O que é isto">i</button></div>'
    + '<p class="dica explica" id="explica-idioma">O site nasce em <strong>inglês</strong>: é o que'
    + ' aparece para quem não escolheu idioma. Em PT e ES, campo vazio usa o inglês, e o texto'
    + ' apagado dentro do campo mostra o original — dá para traduzir olhando para ele.</p>'
    + secao("textos", ehGrupo ? "Info do card" : "Textos",
        !infoCardLigada ? "sem botão de info"
          : (preenchidos.length ? preenchidos.join(" · ") : "vazio"),
        corpoTextos, !infoCardLigada || !preenchidos.length,
        (ehGrupo ? "É o que aparece no card do carrossel, junto da tag. Vazio, o card usa o texto da capa. "
                 : "É o que aparece ao clicar no cantinho colorido da foto, no site. ")
        + (ehGrupo && faixaDeAnos(it)
            ? "No site o card mostra <strong>" + esc(faixaDeAnos(it)) + "</strong>, da foto mais antiga à mais nova. " : "")
        + "O botão de info liga e desliga esse cantinho.")
    + secao("classe", "Tag e coleções",
        (val(it, "tag") || "sem tag") + (minhas.length ? " · " + minhas.join(", ") : ""),
        corpoClasse, !val(it, "tag"),
        "A fila de cima é a <strong>tag</strong>, o filtro da barra do site — uma por foto. A de baixo são as <strong>coleções</strong>, que viram cards na página Mix; a mesma foto pode estar em várias, e em nenhuma ela aparece só no All.")
    + (ehGrupo ? secao("pagina", "Foto " + (iSel + 1) + " de " + seq.length + (iSel === 0 ? " · capa" : ""),
        resumoPagina, corpoPagina, false,
        (iSel === 0 ? "Esta é a capa: o texto dela aparece na 1ª página do carrossel. "
                    : "O texto aparece quando esta foto está na tela, dentro do carrossel. ")
        + "Arraste as miniaturas para mudar a ordem; a primeira é sempre a capa.") : "")
    + (ehSeguidora(it) && !ehArq(it)
        ? '<div class="dica">Esta foto é uma página de outro card. Para tirar do site, arquive o card que a contém, ou desfaça o carrossel.</div>'
        : "");
  $("fCorpo").innerHTML = corpo;
  /* o "i" mostra e esconde a explicação daquela seção, sem abrir ou
     fechar a seção junto */
  $("fCorpo").querySelectorAll("[data-ajuda]").forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const p = $("explica-" + b.dataset.ajuda);
      if (!p) return;
      const mostrar = !p.classList.contains("on");
      p.classList.toggle("on", mostrar);
      b.setAttribute("aria-expanded", String(mostrar));
      const d = b.closest("details");
      if (mostrar && d && !d.open) d.open = true;
    };
  });
  /* a seção aberta sobrevive ao redesenho */
  $("fCorpo").querySelectorAll("details.secao").forEach((d) => {
    d.addEventListener("toggle", () => {
      if (d.open) abertas.add(d.dataset.s); else abertas.delete(d.dataset.s);
    });
  });

  /* --- ligações --- */
  const liga = (id, campo, dono) => {
    const el = $(id);
    if (!el) return;
    el.oninput = () => { dono(it.caminho, campo, el.value.trim()); };
    el.onchange = () => { salvar(); desenhar(); };
  };
  liga("fFrase", "phrase", editarLingua);
  liga("fNome", "name", editarLingua);
  liga("fAno", "year", editar);
  liga("fLink", "link", editar);
  liga("fGrpFrase", "phrase", editarGrupoLingua);
  liga("fGrpNome", "name", editarGrupoLingua);
  liga("fGrpAno", "year", editarGrupo);
  liga("fGrpLink", "link", editarGrupo);

  $("fIdiomas").querySelectorAll("[data-lg]").forEach((b) => {
    b.onclick = () => { idioma = b.dataset.lg; abrirPainel(caminho); };
  });
  $("fInfoCard").onclick = () => {
    const marca = marcaInfo(!infoCardLigada);
    if (ehGrupo) editarGrupo(it.caminho, "noInfo", marca); else editar(it.caminho, "noInfo", marca);
    salvar(); abrirPainel(caminho); desenhar();
  };
  $("fTags").querySelectorAll("[data-t]").forEach((b) => {
    b.onclick = () => {
      editar(it.caminho, "tag", b.dataset.t === "" ? null : b.dataset.t);
      salvar(); abrirPainel(caminho); desenhar();
    };
  });
  $("fCols").querySelectorAll("[data-c]").forEach((b) => {
    b.onclick = () => {
      const c = b.dataset.c;
      const agora = colecoesDe(it);
      definirColecoes(it.caminho, agora.includes(c) ? agora.filter((x) => x !== c) : agora.concat([c]));
      salvar(); abrirPainel(caminho); desenhar();
    };
  });
  $("btNovaColPainel").onclick = async () => {
    const nome = await perguntar("Nova coleção", "Ela já entra nesta foto.", { dica: "Nome da coleção" });
    if (!nome) return;
    const limpo = criarColecao(nome);
    if (!limpo) return;
    const agora = colecoesDe(it);
    if (!agora.includes(limpo)) definirColecoes(it.caminho, agora.concat([limpo]));
    salvar(); abrirPainel(caminho); desenhar();
  };
  if (ehGrupo) {
    const ligaPag = (id, campo, dono) => {
      const el = $(id);
      if (!el) return;
      el.oninput = () => { dono(paginaSel, campo, el.value.trim()); };
      el.onchange = () => { salvar(); desenhar(); };
    };
    ligaPag("fPagFrase", "phrase", editarLingua);
    ligaPag("fPagNome", "name", editarLingua);
    ligaPag("fPagAno", "year", editar);
    ligaPag("fPagLink", "link", editar);
    $("fInfoPag").onclick = () => {
      editar(paginaSel, "noInfo", marcaInfo(desligada(vSel("noInfo"))));
      salvar(); abrirPainel(caminho); desenhar();
    };
    /* AS PÁGINAS: clicar escolhe, arrastar muda a ordem. A primeira da
       fila é a capa - é o que ela pediu no lugar do botão "usar como
       capa", que continuava existindo só para isso. */
    $("fTiras").querySelectorAll("[data-p]").forEach((t) => {
      t.onclick = () => { paginaSel = t.dataset.p; abertas.add("pagina"); abrirPainel(caminho); };
      t.ondragstart = (e) => { e.dataTransfer.setData("text/plain", "pg:" + t.dataset.k); t.classList.add("arrastando"); };
      t.ondragend = () => t.classList.remove("arrastando");
      t.ondragover = (e) => { e.preventDefault(); t.classList.add("alvo"); };
      t.ondragleave = () => t.classList.remove("alvo");
      t.ondrop = (e) => {
        e.preventDefault(); t.classList.remove("alvo");
        const d = String(e.dataTransfer.getData("text/plain") || "");
        if (d.indexOf("pg:") !== 0) return;
        const de = +d.slice(3), para = +t.dataset.k;
        if (de === para) return;
        const ordem = seq.map((x) => x.caminho);
        const [x] = ordem.splice(de, 1);
        ordem.splice(para, 0, x);
        reordenarPaginas(ordem);
      };
    });
  }
  $("fArquivar").textContent = ehArq(it) ? "Desarquivar" : "Arquivar";
  $("fArquivar").onclick = () => {
    editar(it.caminho, "archived", ehArq(it) ? false : true);
    salvar(); desenhar();
    mostrarEstado(ehArq(it) ? "arquivada" : "de volta", "ok");
    abrirPainel(caminho);
  };
  $("fAviso").textContent = ehGrupo
    ? seq.length + " páginas · arraste para mudar a ordem · vale no site depois de Salvar"
    : "vale no site depois de Salvar";

  const lista = visiveis();
  const idx = lista.findIndex((x) => x.caminho === caminho);
  $("fAnterior").disabled = idx <= 0;
  $("fProxima").disabled = idx < 0 || idx >= lista.length - 1;
  $("fAnterior").onclick = () => { if (idx > 0) abrirPainel(lista[idx - 1].caminho); };
  $("fProxima").onclick = () => { if (idx >= 0 && idx < lista.length - 1) abrirPainel(lista[idx + 1].caminho); };

  $("veuFoto").hidden = false;
}
function fecharPainel() {
  $("veuFoto").hidden = true;
  atual = null;
  desenhar();
}
/* a nova ordem das páginas: a primeira lidera (é a capa) */
function reordenarPaginas(ordem) {
  if (!ordem.length) return;
  ordem.forEach((c) => { editar(c, "carrossel", ""); editar(c, "carrosselDe", ""); });
  editar(ordem[0], "carrossel", ordem.slice(1));
  ordem.slice(1).forEach((c) => editar(c, "carrosselDe", ordem[0]));
  paginaSel = ordem[0];
  salvar(); desenhar();
  mostrarEstado("nova ordem do carrossel · a capa é a primeira", "ok");
  if (itens.find((x) => x.caminho === ordem[0])) abrirPainel(ordem[0]);
  else fecharPainel();
}

/* ---------- DESENHAR TUDO ---------- */
function desenhar() {
  desenharLado();
  desenharAlternador();
  desenharChips();
  desenharGrade();
  atualizarSel();

  const editados = Object.keys(edicoes).length;
  $("repoNome").textContent = (donoDoRepo() ? donoDoRepo().dono + "/" + donoDoRepo().repo : "sem repositório")
    + (editados ? " · " + editados + (editados === 1 ? " editada" : " editadas") : "");
  $("btSalvar").textContent = lerToken() ? "Salvar no GitHub" : "Conectar ao GitHub";
  $("btSalvar").disabled = !temTrabalho() && !!lerToken();
  $("btExportar").disabled = !temTrabalho();
  if ($("popColecoes").classList.contains("on")) desenharPopColecoes();
  if (!selecao.size) fecharPopColecoes();

  const nSem = semTag();
  $("aviso").innerHTML = (armazenaOk ? "" :
      '<div class="aviso grave"><strong>Este navegador não está guardando suas edições.</strong> '
      + 'Salve no GitHub antes de fechar a aba, senão o trabalho se perde.</div>')
    + (nSem ? '<div class="aviso"><strong>' + nSem + '</strong> '
      + (nSem === 1 ? "foto ainda não tem" : "fotos ainda não têm")
      + ' tag. Elas aparecem no site, mas só no filtro “All”.</div>' : "");
}

/* ---------- CONFIGURAÇÕES ---------- */
function abrirConfig(focoNaChave) {
  $("qtdVis").textContent = tagsVisiveis;
  $("dicaChave").textContent = lerToken()
    ? "Já há uma chave guardada neste navegador. Cole outra para trocar."
    : "Serve para o botão Salvar escrever no repositório.";
  $("veuConfig").hidden = false;
  if (focoNaChave) setTimeout(() => $("fChave").focus(), 30);
}
function fecharConfig() { $("veuConfig").hidden = true; }

/* ---------- LIGAR ---------- */
function pintarIconeTema() {
  const escuro = document.documentElement.dataset.tema === "escuro";
  $("icTema").innerHTML = escuro ? SOL : LUA;
}
$("btTema").onclick = () => {
  const escuro = document.documentElement.dataset.tema !== "escuro";
  document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
  try { localStorage.setItem("mix-tema", escuro ? "escuro" : "claro"); } catch (e) {}
  pintarIconeTema();
};
pintarIconeTema();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (ev) => {
  let escolhido = "";
  try { escolhido = localStorage.getItem("mix-tema") || ""; } catch (e) {}
  if (escolhido) return;
  document.documentElement.dataset.tema = ev.matches ? "escuro" : "claro";
  pintarIconeTema();
});

document.querySelectorAll("[data-vista]").forEach((b) => {
  b.onclick = () => {
    filtroCol = "";
    filtro = b.dataset.vista === "todas" ? "" : b.dataset.vista === "semtag" ? "__sem" : "__arq";
    if (filtro === "__arq") mostrar = "fotos";
    desenhar();
  };
});
const ligarDobra = (bt, dobra) => {
  const aplicar = (aberta) => {
    $(bt).setAttribute("aria-expanded", String(aberta));
    $(dobra).hidden = !aberta;
  };
  aplicar(dobraAberta(dobra));
  $(bt).onclick = () => {
    const aberta = $(bt).getAttribute("aria-expanded") !== "true";
    aplicar(aberta); gravarDobra(dobra, aberta);
  };
};
ligarDobra("btDobraCol", "dobraCol");
ligarDobra("btDobraTag", "dobraTag");

const ligarCriar = (bt, campo, input, criar) => {
  const sair = () => { $(campo).hidden = true; $(bt).hidden = false; $(input).value = ""; };
  $(bt).onclick = () => { $(campo).hidden = false; $(bt).hidden = true; $(input).focus(); };
  $(input).onkeydown = (e) => {
    if (e.key === "Escape") { sair(); return; }
    if (e.key !== "Enter") return;
    const n = $(input).value.trim();
    if (!n) { sair(); return; }
    criar(n); sair(); desenhar();
  };
  $(input).onblur = () => { if (!$(input).value.trim()) sair(); };
};
ligarCriar("btNovaCol", "campoCol", "novaCol", (n) => {
  const nome = criarColecao(n);
  if (nome) mostrarEstado("“" + nome + "” criada — entra no site quando ganhar a primeira foto", "ok");
});
ligarCriar("btNovaTag", "campoTag", "novaTag", (n) => {
  if (!ordemTags.includes(n)) ordemTags.push(n);
  salvar();
  mostrarEstado("tag “" + n + "” criada — marque as fotos e use o ícone de tag", "ok");
});

/* a busca: ícone fechado, campo aberto */
const abrirBusca = () => { $("caixaBusca").classList.add("aberta"); $("busca").focus(); };
const fecharBusca = () => {
  $("caixaBusca").classList.remove("aberta");
  if (busca) { busca = ""; $("busca").value = ""; desenharGrade(); }
};
$("caixaBusca").onclick = (e) => {
  if (e.target.closest("#btLimparBusca")) { fecharBusca(); return; }
  abrirBusca();
};
$("busca").oninput = (e) => { busca = e.target.value; desenharGrade(); };
$("busca").onblur = () => { if (!$("busca").value.trim()) $("caixaBusca").classList.remove("aberta"); };
$("busca").onkeydown = (e) => { if (e.key === "Escape") { e.stopPropagation(); fecharBusca(); $("busca").blur(); } };
$("btMais").onclick = () => { zoom = Math.min(ZOOMS.length - 1, zoom + 1); desenharGrade(); };
$("btMenos").onclick = () => { zoom = Math.max(0, zoom - 1); desenharGrade(); };
$("btLimparSel").onclick = () => { selecao.clear(); desenhar(); };
$("btCriarColSel").onclick = criarColecaoDasMarcadas;
$("btCriarCar").onclick = agruparCarrossel;
$("btDesagrupar").onclick = desagrupar;
$("btTagAcao").onclick = (e) => {
  e.stopPropagation();
  const n = selecao.size;
  abrirMenu(e, ordemTags.map((t) => ({ id: "t" + t, rotulo: t, faz: () => {
      aplicarTag(t);
      mostrarEstado("tag “" + t + "” em " + n + (n === 1 ? " foto" : " fotos"), "ok");
    } }))
    .concat(["-", { id: "tirar", rotulo: "Tirar a tag", faz: () => {
      aplicarTag(null);
      mostrarEstado("tag tirada de " + n + (n === 1 ? " foto" : " fotos"), "ok");
    } }]));
};
$("btColAcao").onclick = (e) => {
  e.stopPropagation();
  if ($("popColecoes").classList.contains("on")) fecharPopColecoes(); else abrirPopColecoes();
};
document.addEventListener("pointerdown", (e) => {
  if (!$("popColecoes").classList.contains("on")) return;
  if (e.target.closest("#popColecoes, #btColAcao, .cartao")) return;
  fecharPopColecoes();
});

$("fFechar").onclick = fecharPainel;
$("fPronto").onclick = fecharPainel;
$("veuFoto").onclick = (e) => { if (e.target === $("veuFoto")) fecharPainel(); };

$("btConfig").onclick = () => abrirConfig(false);
$("btFecharConfig").onclick = fecharConfig;
$("veuConfig").onclick = (e) => { if (e.target === $("veuConfig")) fecharConfig(); };
$("btSalvar").onclick = salvarNoGitHub;
$("btExportar").onclick = exportar;
$("btRecarregar").onclick = () => { fecharConfig(); carregar(); };
$("url").onchange = () => { salvar(); carregar(); };
$("btGuardarChave").onclick = () => {
  const t = $("fChave").value.trim();
  if (!t) return;
  gravarToken(t);
  $("fChave").value = "";
  fecharConfig();
  mostrarEstado("chave guardada", "ok");
  desenhar();
  salvarNoGitHub();
};
$("btApagarChave").onclick = () => {
  gravarToken("");
  $("fChave").value = "";
  mostrarEstado("chave apagada", "");
  desenhar();
};
$("btMenosTags").onclick = () => { tagsVisiveis = Math.max(0, tagsVisiveis - 1); salvar(); $("qtdVis").textContent = tagsVisiveis; };
$("btMaisTags").onclick = () => { tagsVisiveis = Math.min(ordemTags.length, tagsVisiveis + 1); salvar(); $("qtdVis").textContent = tagsVisiveis; };

document.addEventListener("keydown", (e) => {
  const digitando = e.target && e.target.matches && e.target.matches("input, textarea");
  if (e.key === "Escape") {
    if (digitando) { e.target.blur(); return; }
    if (menuAberto) { fecharMenu(); return; }
    if (!$("veuPergunta").hidden) { $("pgNao").click(); return; }
    if (!$("veuFoto").hidden) { fecharPainel(); return; }
    if (!$("veuConfig").hidden) { fecharConfig(); return; }
    if ($("popColecoes").classList.contains("on")) { fecharPopColecoes(); return; }
    if (selecao.size) { selecao.clear(); desenhar(); }
    return;
  }
  if ($("veuFoto").hidden || digitando) return;
  if (e.key === "ArrowRight" && !$("fProxima").disabled) $("fProxima").click();
  if (e.key === "ArrowLeft" && !$("fAnterior").disabled) $("fAnterior").click();
});

/* ---------- INÍCIO ---------- */
(function () {
  let g = {};
  try { g = JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch (e) {}
  $("url").value = g.url || "https://cdn.jsdelivr.net/gh/gabidinizmg/mix@main/images.json";
  edicoes = g.edicoes || {};
  ordemTags = g.ordemTags || ["Design", "Motion", "Draw", "Photo", "3D"];
  tagsVisiveis = g.tagsVisiveis === undefined ? 2 : g.tagsVisiveis;
  colecoesDef = g.colecoesDef && typeof g.colecoesDef === "object" ? g.colecoesDef : null;
  desenhar();
  carregar();
})();

</script>
</body>
</html>
