<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mix — Organizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   O ORGANIZADOR — layout de 19/09/2026
   -------------------------------------------------------------
   O desenho que ela aprovou (ver mix-github/proposta/): menu lateral
   com as coleções e as tags, busca e filtros no alto, grade no meio,
   e o pop-up da foto por cima. As referências que ela escolheu foram
   um app de bibliotecas de fotos (o menu), uma galeria (a busca com
   filtros) e as pilhas de "Spaces" (a coleção que abre em leque).

   DOIS TEMAS, como antes: o escuro é o padrão e o claro redefine só os
   tokens. Quem manda é `data-tema` no <html>, escrito antes da primeira
   pintura pelo script lá em cima.
   ============================================================= */
:root {
  --fundo: #121116;
  --painel: #1A1920;
  --painel-2: #232230;
  --linha: rgba(255,255,255,.09);
  --texto: #EFEBF9;
  --texto-2: rgba(239,235,249,.58);
  --texto-3: rgba(239,235,249,.38);
  --roxo: #7C54FF;
  --verde: #24FB99;
  --amarelo: #FFF20B;
  --ok: #3BD98F;
  --erro: #FF9A8F;
  --aviso: #F0C24A;
  --sombra: rgba(0,0,0,.6);
  --r: 14px;
  --mola: cubic-bezier(.22,1,.36,1);
}
html[data-tema="claro"] {
  --fundo: #F6F4FD;
  --painel: #FFFFFF;
  --painel-2: #EFEAFB;
  --linha: rgba(53,34,112,.13);
  --texto: #352270;
  --texto-2: rgba(53,34,112,.66);
  --texto-3: rgba(53,34,112,.45);
  --ok: #0B7A4B;
  --erro: #B3261E;
  --aviso: #8A6100;
  --sombra: rgba(53,34,112,.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--fundo); color: var(--texto);
  font: 14px/1.5 "Outfit", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
img, video { display: block; }
::selection { background: rgba(124,84,255,.35); }
:focus-visible { outline: 2px solid var(--roxo); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100%; }

/* ---------- MENU LATERAL ---------- */
.lado {
  border-right: 1px solid var(--linha); background: var(--painel);
  display: flex; flex-direction: column; gap: 3px;
  padding: 16px 12px calc(14px + env(safe-area-inset-bottom, 0px));
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.marca .bolha {
  width: 26px; height: 26px; border-radius: 9px; background: var(--roxo);
  display: grid; place-items: center; font: 600 12px "Outfit",sans-serif; color: #fff;
}
.marca .nome { font: 600 15px "Outfit",sans-serif; letter-spacing: -.01em; }
.marca .repo { font-size: 11px; color: var(--texto-3); word-break: break-all; }
.marca .tema {
  margin-left: auto; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; color: var(--texto-2);
}
.marca .tema:hover { background: var(--painel-2); color: var(--texto); }

.item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 10px; border-radius: 10px; text-align: left;
  color: var(--texto-2); transition: background .15s, color .15s;
}
.item:hover { background: var(--painel-2); color: var(--texto); }
.item.on { background: var(--painel-2); color: var(--texto); box-shadow: inset 2px 0 0 var(--roxo); }
.item .rotulo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .qtd { font-size: 12px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
.item .engrenagem { opacity: 0; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; }
.item:hover .engrenagem { opacity: .7; }
.item .engrenagem:hover { background: rgba(124,84,255,.2); opacity: 1; }
.item.arrastando { opacity: .4; }
.item.alvo { box-shadow: inset 0 2px 0 var(--roxo); }
.item.oculta-linha .rotulo { text-decoration: line-through; color: var(--texto-3); }
.pega { color: var(--texto-3); cursor: grab; display: grid; place-items: center; width: 13px; }

.secao-bt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: 600 10.5px/1 "Outfit",sans-serif; letter-spacing: .12em; text-transform: uppercase;
  color: var(--texto-3); padding: 15px 10px 7px; text-align: left;
}
.secao-bt:hover { color: var(--texto-2); }
.secao-bt .rotulo { flex: 1; }
.secao-bt .seta { transition: transform .25s var(--mola); display: grid; place-items: center; }
.secao-bt[aria-expanded="false"] .seta { transform: rotate(-90deg); }
.dobra { display: grid; gap: 2px; }
.dobra[hidden] { display: none; }

.novo-bt {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 10px; border-radius: 10px; color: var(--texto-3); font-size: 13.5px;
}
.novo-bt:hover { background: var(--painel-2); color: var(--texto-2); }
.novo-bt .mais { width: 13px; text-align: center; font-size: 15px; line-height: 1; }
.novo-campo { padding: 4px 10px 6px; }
.novo-campo[hidden] { display: none; }
.novo-campo input {
  width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--roxo);
  background: var(--fundo); padding: 0 12px; font-size: 13.5px; outline: none;
}
.novo-campo .dica { font-size: 11px; color: var(--texto-3); padding: 5px 2px 0; }

.rodape { margin-top: auto; padding-top: 14px; display: grid; gap: 8px; }
.config-bt {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; border-radius: 11px; border: 1px solid var(--linha); color: var(--texto-2); font-size: 13.5px;
}
.config-bt:hover { background: var(--painel-2); color: var(--texto); }
.salvar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; border-radius: 12px; background: var(--roxo); color: #fff;
  font: 500 14px "Outfit",sans-serif;
}
.salvar:hover:not(:disabled) { filter: brightness(1.12); }
.salvar:disabled { opacity: .45; cursor: default; }
.estado { font-size: 11.5px; color: var(--texto-3); text-align: center; min-height: 17px;
  display: flex; align-items: center; justify-content: center; gap: 7px; line-height: 1.4; }
.estado.ok { color: var(--ok); }
.estado.erro { color: var(--erro); }
.estado.aviso { color: var(--aviso); }
.girando { width: 12px; height: 12px; border: 2px solid var(--linha);
  border-top-color: var(--roxo); border-radius: 50%; animation: gira .7s linear infinite; flex-shrink: 0; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- BARRA DE CIMA ---------- */
.topo {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--fundo) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--linha);
  padding: 14px 24px 12px; display: grid; gap: 11px;
}
.titulo-linha { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 22px/1.1 "Outfit",sans-serif; letter-spacing: -.02em; }
.conta { font-size: 13px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
.ferramentas { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
/* A BUSCA É UM ÍCONE ATÉ ELA QUERER ESCREVER.
   Pedido dela: "só um ícone; quando você clica, aí sim você escreve".
   Fechada ela ocupa o mesmo espaço de um botão; aberta, cresce. */
.busca {
  display: flex; align-items: center; gap: 0; height: 36px; padding: 0;
  border-radius: 999px; border: 1px solid transparent; background: transparent;
  width: 36px; flex: 0 0 auto; color: var(--texto-2); cursor: text;
  transition: width .3s var(--mola), background .2s, border-color .2s, gap .2s, padding .2s;
}
.busca > svg { flex-shrink: 0; margin: 0 10px; }
.busca:hover { color: var(--texto); }
.busca.aberta {
  width: min(250px, 42vw); background: var(--painel); border-color: var(--linha); padding-right: 6px;
}
.busca.aberta:focus-within { border-color: var(--roxo); }
.busca input {
  flex: 1; min-width: 0; width: 0; border: 0; background: none; outline: none; font-size: 13.5px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.busca.aberta input { opacity: 1; pointer-events: auto; }
.busca .limpar { width: 24px; height: 24px; border-radius: 50%; display: none; place-items: center; color: var(--texto-3); }
.busca.aberta .limpar { display: grid; }
.busca .limpar:hover { background: var(--painel-2); color: var(--texto); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--linha); background: var(--painel);
  font-size: 13.5px; color: var(--texto-2); transition: all .16s;
}
.chip:hover { color: var(--texto); border-color: color-mix(in srgb, var(--texto-3) 60%, transparent); }
.chip.on { color: var(--texto); border-color: var(--roxo); background: rgba(124,84,255,.16); }
.chip .n { font-size: 12px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
/* O ALTERNADOR SEM CAIXA: só as três palavras, e um traço embaixo da
   que está valendo. Ela: "queria o toggle mais minimalista ainda". */
.alternador { display: inline-flex; gap: 16px; align-items: center; }
.alternador button {
  font-size: 13.5px; color: var(--texto-3); padding: 2px 0 4px;
  border-bottom: 1.5px solid transparent; display: inline-flex; align-items: baseline; gap: 5px;
}
.alternador button:hover { color: var(--texto-2); }
.alternador button.on { color: var(--texto); border-bottom-color: var(--roxo); }
.alternador .n { font-size: 11px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
.acao { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--linha);
  background: var(--painel); color: var(--texto-2); display: grid; place-items: center; }
.acao:hover { color: var(--texto); border-color: color-mix(in srgb, var(--texto-3) 60%, transparent); }
.acao.on { color: var(--texto); border-color: var(--roxo); background: rgba(124,84,255,.16); }
.acao.forte { background: var(--roxo); border-color: var(--roxo); color: #fff; }
.acao.forte:hover { filter: brightness(1.12); }
.grupo-acao { display: inline-flex; align-items: center; gap: 6px; }
.grupo-acao[hidden] { display: none; }
.contador { font-size: 12.5px; color: var(--texto-2); padding: 0 2px; font-variant-numeric: tabular-nums; }
.zoom { display: inline-flex; align-items: center; gap: 2px; margin-left: auto;
  border: 1px solid var(--linha); border-radius: 999px; background: var(--painel); padding: 3px; }
.zoom button { width: 30px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--texto-2); }
.zoom button:hover:not(:disabled) { background: var(--painel-2); color: var(--texto); }
.zoom button:disabled { opacity: .3; cursor: default; }

/* ---------- A GRADE ---------- */
.miolo { padding: 18px 24px 70px; }
.aviso {
  margin-bottom: 14px; padding: 12px 15px; border-radius: 12px;
  background: color-mix(in srgb, var(--amarelo) 16%, var(--painel));
  border: 1px solid color-mix(in srgb, var(--amarelo) 40%, transparent);
  font-size: 13px; color: var(--texto);
}
.aviso.grave { background: color-mix(in srgb, var(--erro) 16%, var(--painel));
  border-color: color-mix(in srgb, var(--erro) 40%, transparent); }
.grade { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); }
.cartao { display: grid; gap: 8px; position: relative; }
/* A PILHA ABERTA PASSA POR CIMA DOS VIZINHOS.
   Sem isto o card seguinte é pintado em cima das folhas (ordem do DOM) e
   o leque só aparecia do lado direito do último da fila - era a
   diferença que ela viu entre a ferramenta e a proposta. */
.cartao:hover, .cartao:focus-within { z-index: 6; }
.moldura {
  position: relative; aspect-ratio: 3/4; border-radius: var(--r);
  background: var(--painel); cursor: pointer; border: 1px solid var(--linha); overflow: visible;
}
.moldura > img, .moldura > video { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.moldura.marcada { outline: 2px solid var(--roxo); outline-offset: 2px; }
.moldura.solta { outline: 2px dashed var(--verde); outline-offset: 3px; }
.moldura.solta::after {
  content: "soltar para juntar"; position: absolute; inset: auto 6px 6px; z-index: 7;
  text-align: center; font: 500 11.5px "Outfit",sans-serif; color: #08210f;
  background: var(--verde); border-radius: 8px; padding: 4px 6px;
}
.cartao .nome { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cartao .meta { font-size: 12px; color: var(--texto-3); display: flex; gap: 7px; align-items: center; }
.ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--roxo); flex-shrink: 0; }
.selo {
  position: absolute; top: 8px; left: 8px; z-index: 4;
  font: 600 10.5px "Outfit",sans-serif; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; background: rgba(18,17,22,.72);
  backdrop-filter: blur(8px); color: #EFEBF9;
}
.selo.sem { background: var(--amarelo); color: #17150b; }
.selo.arq { background: rgba(179,38,30,.85); color: #fff; }
.marca-sel {
  position: absolute; top: 8px; right: 8px; z-index: 5;
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid rgba(255,255,255,.8); background: rgba(18,17,22,.5);
  backdrop-filter: blur(6px); color: transparent; opacity: 0; transition: all .16s;
}
.cartao:hover .marca-sel, .cartao:focus-within .marca-sel { opacity: 1; }
.moldura.marcada .marca-sel { background: var(--roxo); border-color: var(--roxo); color: #fff; opacity: 1; }

/* A PILHA: um carrossel. Parada, as folhas ficam atrás da capa; no
   hover elas saem em leque - foi o que ela pediu, "as imagens meio que
   saem para você entrar na pasta". Só transform e opacidade. */
.pilha .folha {
  position: absolute; inset: 0; border-radius: var(--r); overflow: hidden;
  box-shadow: 0 12px 30px -18px var(--sombra);
  transition: transform .42s var(--mola), opacity .3s; transform-origin: 50% 92%;
}
.pilha .folha img, .pilha .folha video { width: 100%; height: 100%; object-fit: cover; }
.pilha .f1 { transform: rotate(-2.5deg) translateY(2px) scale(.965); opacity: .55; }
.pilha .f2 { transform: rotate(2deg) translateY(1px) scale(.98); opacity: .8; }
.pilha:hover .f1, .pilha:focus-visible .f1 { transform: rotate(-11deg) translate(-16%,-6%) scale(.93); opacity: 1; }
.pilha:hover .f2, .pilha:focus-visible .f2 { transform: rotate(8.5deg) translate(15%,-4%) scale(.95); opacity: 1; }
.pilha:hover .f3, .pilha:focus-visible .f3 { transform: translateY(-3%) scale(1.01); }
.pilha .entrar {
  position: absolute; left: 50%; bottom: 10px; transform: translate(-50%,14px);
  z-index: 6; opacity: 0; transition: opacity .25s, transform .35s var(--mola);
  background: rgba(18,17,22,.82); backdrop-filter: blur(10px); color: #EFEBF9;
  border-radius: 999px; padding: 7px 14px; font: 500 12.5px "Outfit",sans-serif;
  pointer-events: none; white-space: nowrap;
}
.pilha:hover .entrar, .pilha:focus-visible .entrar { opacity: 1; transform: translate(-50%,0); }

/* O CARD DE UMA COLEÇÃO: mosaico de 9 */
.mosaico {
  position: relative; aspect-ratio: 1/1; border-radius: var(--r); overflow: hidden;
  border: 1px solid var(--linha); background: var(--painel);
  display: grid; grid-template-columns: repeat(3,1fr); grid-auto-rows: 1fr; gap: 2px;
  padding: 2px; cursor: pointer; transition: border-color .2s, transform .35s var(--mola);
}
.mosaico:hover { border-color: color-mix(in srgb, var(--roxo) 60%, transparent); transform: translateY(-2px); }
.mosaico img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.mosaico .buraco { background: color-mix(in srgb, var(--texto-3) 12%, transparent); border-radius: 3px; }
.linha-nome { display: flex; align-items: center; gap: 8px; }
.linha-nome .txt { flex: 1; min-width: 0; }
.linha-nome .engrenagem { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  color: var(--texto-3); opacity: 0; }
.cartao:hover .linha-nome .engrenagem { opacity: .8; }
.linha-nome .engrenagem:hover { background: var(--painel-2); color: var(--texto); opacity: 1; }
.vazio { padding: 60px 10px; text-align: center; color: var(--texto-3); }

/* ---------- MENU DO BOTÃO DIREITO ---------- */
.menu {
  position: fixed; z-index: 120; min-width: 196px; padding: 6px;
  background: var(--painel-2); border: 1px solid var(--linha); border-radius: 12px;
  box-shadow: 0 30px 60px -30px var(--sombra);
}
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
  border-radius: 8px; font-size: 13.5px; text-align: left; }
.menu button:hover { background: color-mix(in srgb, var(--texto-3) 18%, transparent); }
.menu button.perigo:hover { background: color-mix(in srgb, var(--erro) 25%, transparent); color: var(--erro); }
.menu .risco { height: 1px; background: var(--linha); margin: 5px 2px; }

/* ---------- PÔR EM COLEÇÕES (seleção em lote) ---------- */
.pop-col {
  position: fixed; z-index: 110; right: 24px; top: 132px;
  width: min(330px, calc(100vw - 32px)); max-height: min(420px,60vh); overflow-y: auto;
  padding: 10px; border-radius: var(--r); background: var(--painel);
  box-shadow: 0 30px 60px -28px var(--sombra), 0 0 0 1px var(--linha);
  opacity: 0; pointer-events: none; transform: translateY(-8px);
  transition: opacity .2s, transform .28s var(--mola);
}
.pop-col.on { opacity: 1; pointer-events: auto; transform: none; }
.pop-col .titulo { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--texto-3); padding: 4px 6px 8px; }
.opcao-col { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px;
  border-radius: 12px; text-align: left; font-size: 14px; }
.opcao-col:hover { background: var(--painel-2); }
.opcao-col img, .opcao-col .sem-capa { width: 32px; height: 32px; border-radius: 8px; object-fit: cover;
  flex-shrink: 0; background: var(--painel-2); }
.opcao-col .nome { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca3 { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  border: 1.5px solid var(--linha); color: transparent; transition: all .18s var(--mola); }
.marca3.todas { background: var(--roxo); border-color: var(--roxo); color: #fff; }
.marca3.algumas { background: rgba(124,84,255,.25); border-color: var(--roxo); color: var(--roxo); }
.criar-col { display: flex; gap: 8px; margin-top: 8px; padding: 8px 2px 2px; border-top: 1px solid var(--linha); }
.criar-col input { flex: 1; min-width: 0; height: 36px; background: var(--fundo); border: 1px solid var(--linha);
  border-radius: 999px; padding: 0 14px; font-size: 13.5px; outline: none; }
.criar-col input:focus { border-color: var(--roxo); }

/* ---------- VÉU, POP-UP DA FOTO, PERGUNTA, CONFIGURAÇÕES ---------- */
.veu { position: fixed; inset: 0; z-index: 100; background: color-mix(in srgb, var(--fundo) 72%, #000);
  backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; }
.veu[hidden] { display: none; }
.caixa { width: min(460px,100%); max-height: 88vh; overflow-y: auto; background: var(--painel);
  border: 1px solid var(--linha); border-radius: 18px; padding: 22px; display: grid; gap: 15px;
  box-shadow: 0 40px 90px -40px var(--sombra); }
.caixa h2 { font: 600 19px "Outfit",sans-serif; }
.caixa p { color: var(--texto-2); font-size: 13.5px; }
.campo { display: grid; gap: 6px; }
.campo label { font-size: 12px; color: var(--texto-2); }
.campo input, .campo textarea {
  border-radius: 11px; border: 1px solid var(--linha); background: var(--fundo);
  padding: 10px 13px; font-size: 13.5px; outline: none; resize: vertical; width: 100%;
}
/* O NOME DO CAMPO MORA DENTRO DELE.
   Ela: "isso pode ficar dentro da caixa caso ela esteja vazia". Com o
   campo preenchido o rotulo nao faz falta - o que esta escrito ja diz o
   que e -, e sem a linha de cima cada campo ganha ar. */
.campo input::placeholder, .campo textarea::placeholder { color: var(--texto-3); }
.campo input:focus, .campo textarea:focus { border-color: var(--roxo); }
/* AS EXPLICAÇÕES SÃO NOTA DE RODAPÉ, não texto da tela.
   Ela: "achei que o texto podia ser mais sutil, ter menos destaque, já
   que é só uma informação". Faltava uma regra para o `.dica` solto: ele
   herdava o corpo de 14px e a cor do texto, e competia com os campos. */
.dica, .campo .dica { font-size: 11.5px; line-height: 1.5; color: var(--texto-3); font-weight: 400; }
.dica strong { font-weight: 500; color: var(--texto-2); }
.duo { display: flex; gap: 8px; }
.duo button, .btn {
  height: 38px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--linha);
  font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.duo button { flex: 1; }
.duo button:hover, .btn:hover:not(:disabled) { background: var(--painel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.forte, .duo button.forte { background: var(--roxo); border-color: var(--roxo); color: #fff; }
.btn.forte:hover:not(:disabled) { filter: brightness(1.12); }
.pergunta { width: min(410px,100%); }

.ficha {
  width: min(1060px,96vw); height: 92vh; max-height: 92vh; display: grid;
  grid-template-columns: minmax(0,1.05fr) minmax(320px,.95fr);
  /* A LINHA TEM QUE ENCOLHER.
     Sem `grid-template-rows: minmax(0,1fr)` a linha fica do tamanho do
     CONTEÚDO: o `max-height` corta a caixa, mas as miniaturas do
     carrossel e o rodapé ficavam para fora, invisíveis. MEDIDO numa
     janela de 768px: a coluna da foto pedia 1074px. */
  grid-template-rows: minmax(0,1fr);
  background: var(--painel); border: 1px solid var(--linha); border-radius: 20px;
  overflow: hidden; box-shadow: 0 50px 110px -50px var(--sombra);
}
.ficha .lado-foto { background: color-mix(in srgb, var(--fundo) 70%, #000);
  display: grid; grid-template-rows: minmax(0,1fr) auto; border-right: 1px solid var(--linha); min-height: 0; }
html[data-tema="claro"] .ficha .lado-foto { background: var(--painel-2); }
.ficha .palco { display: grid; place-items: center; padding: 20px; min-height: 0; }
/* a foto usa o espaço que sobrar, e não uma fatia fixa da tela */
.ficha .palco img, .ficha .palco video { max-width: 100%; max-height: 100%; border-radius: 10px; object-fit: contain; }
.ficha .caminho { font-size: 11px; color: var(--texto-3); padding: 0 20px 8px; text-align: center; word-break: break-all; }
.tiras { display: flex; gap: 8px; padding: 0 18px 16px; overflow-x: auto; }
.tira { width: 58px; height: 58px; border-radius: 9px; overflow: hidden; flex-shrink: 0;
  border: 2px solid transparent; position: relative; cursor: grab; }
.tira img { width: 100%; height: 100%; object-fit: cover; }
.tira.on { border-color: var(--roxo); }
.tira.arrastando { opacity: .35; }
.tira.alvo { border-color: var(--verde); }
.tira .capa-marca { position: absolute; inset: auto 0 0 0; font: 600 8.5px "Outfit",sans-serif;
  letter-spacing: .08em; text-transform: uppercase; text-align: center;
  background: var(--roxo); color: #fff; padding: 2px 0; }
.ficha .lado-dados { display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-height: 0; }
.ficha .cabeca { display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-bottom: 1px solid var(--linha); }
.ficha .cabeca .tit { flex: 1; min-width: 0; font: 600 16px "Outfit",sans-serif;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.redondo { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  color: var(--texto-2); border: 1px solid var(--linha); }
.redondo:hover:not(:disabled) { background: var(--painel-2); color: var(--texto); }
.redondo:disabled { opacity: .3; cursor: default; }
.ficha .corpo { overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 4px; align-content: start; }
.ficha .pe { display: flex; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--linha); align-items: center; }
.ficha .pe .aviso-pe { flex: 1; font-size: 11.5px; color: var(--texto-3); line-height: 1.45; }
.rotulo-campo { font-size: 11.5px; color: var(--texto-2); display: block; }
.dois-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.escolhas { display: flex; flex-wrap: wrap; gap: 7px; }
.escolha { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--linha);
  font-size: 12.5px; color: var(--texto-2); }
.escolha:hover { color: var(--texto); border-color: color-mix(in srgb, var(--texto-3) 60%, transparent); }
.escolha.on { border-color: var(--roxo); background: rgba(124,84,255,.18); color: var(--texto); }
.escolha.verde.on { border-color: var(--verde); background: color-mix(in srgb, var(--verde) 18%, transparent); }
.chave-linha { display: flex; align-items: center; gap: 10px; justify-content: flex-start; }
/* O IDIOMA NA MESMA LINGUAGEM DO "Fotos · Coleções · Carrosséis":
   só as três siglas, com um traço embaixo da que está valendo. O que
   cada uma faz mora atrás do "i", como nas seções. */
.linha-idioma { display: flex; align-items: center; gap: 12px; padding: 2px 0 6px; }
.linha-idioma .ajuda { margin-left: auto; }
.chave { width: 40px; height: 23px; border-radius: 999px; flex-shrink: 0; background: var(--painel-2);
  border: 1px solid var(--linha); position: relative; transition: background .2s, border-color .2s; }
.chave::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
  border-radius: 50%; background: var(--texto-3); transition: transform .24s var(--mola), background .2s; }
.chave[aria-checked="true"] { background: rgba(124,84,255,.28); border-color: var(--roxo); }
.chave[aria-checked="true"]::after { transform: translateX(17px); background: var(--roxo); }
/* ---------- AS SEÇÕES DO POP-UP ----------
   Ela: "isso aqui pode ficar fechado, num accordion". Cada bloco fecha,
   e fechado mostra um RESUMO do que já está preenchido - nomear o que
   está cheio responde em duas palavras; listar o que falta seria a
   lista longa. O que fica aberto é lembrado enquanto o pop-up vive. */
/* ---------- AS SEÇÕES DO POP-UP ----------
   Ela: "não gostei de entrarem num bloco com borda; podia ser mais
   minimalista, como as coleções e tags na barra lateral". Então é a
   MESMA linguagem do menu: um rótulo pequeno em maiúsculas, a seta, e o
   resumo à direita. Sem caixa, sem borda - o respiro separa.
   E as explicações saem da tela: ficam atrás do "i" de cada seção. */
.secao { border: 0; background: none; }
.secao + .secao { margin-top: 10px; }
.secao > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 8px 2px 6px; border-radius: 8px;
  font: 600 10.5px/1 "Outfit",sans-serif; letter-spacing: .12em; text-transform: uppercase;
  color: var(--texto-3);
}
.secao > summary::-webkit-details-marker { display: none; }
.secao > summary:hover { color: var(--texto-2); }
.secao[open] > summary { color: var(--texto-2); }
.secao > summary:focus-visible { outline: 2px solid var(--roxo); outline-offset: -2px; }
.secao .seta-s { color: var(--texto-3); display: grid; place-items: center; transition: transform .2s var(--mola); }
.secao[open] .seta-s { transform: rotate(90deg); }
.secao .nome-s { white-space: nowrap; }
.secao .resumo-s {
  margin-left: auto; margin-right: 2px; color: var(--texto-3); font-size: 11.5px; font-weight: 400;
  letter-spacing: 0; text-transform: none; text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58%;
}
.secao .resumo-s.falta { color: var(--aviso); }
.secao .corpo-s { padding: 8px 2px 6px; display: grid; gap: 20px; }
/* O "i": só a letra, sempre na PONTA DIREITA da linha, para os de todas
   as seções ficarem alinhados. Sem círculo parado; o hover é que mostra
   que ali tem um botão. */
.ajuda {
  border: 0; background: none; border-radius: 6px; padding: 3px 6px;
  color: var(--texto-3); display: grid; place-items: center; flex-shrink: 0;
  font: 600 11px/1 "Outfit",sans-serif; letter-spacing: 0; text-transform: none;
  transition: color .15s, background .15s;
}
.ajuda:hover { color: var(--texto); background: color-mix(in srgb, var(--texto-3) 16%, transparent); }
.ajuda[aria-expanded="true"] { color: var(--roxo); }
.explica { display: none; }
.explica.on { display: block; }

@media (max-width: 900px) {
  .ficha { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); height: 94vh; max-height: 94vh; }
  .ficha .lado-foto { border-right: 0; border-bottom: 1px solid var(--linha); }
  .ficha .palco img, .ficha .palco video { max-height: 30vh; }
  .ficha .lado-foto { grid-template-rows: auto auto auto; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .lado { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--linha); }
  .miolo { padding: 16px; }
  .topo { padding: 12px 16px; }
  .zoom { margin-left: 0; }
}
</style>

<script>
/* TEMA ANTES DE PINTAR. Se isto rodasse junto com o resto do script, la
   embaixo, a pagina abriria clara e viraria escura na frente dela. */
(function () {
  var t = "";
  try { t = localStorage.getItem("mix-tema") || ""; } catch (e) {}
  var esc = t ? t === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.tema = esc ? "escuro" : "claro";
})();
</script>

        <button type="button" id="btMaisTags">+</button>

</div>

<script>
/* ============================================================
   ESTADO
   ------------------------------------------------------------
   `edicoes` e o que a ferramenta produz: um mapa
   caminho-no-repositorio -> detalhes. E salvo no navegador a cada
   mudanca, entao fechar a aba sem exportar nao perde nada.
   ============================================================ */
const CHAVE = "mix-organizador-v1";
const CHAVE_TOKEN = "mix-organizador-token";   /* guardado separado do resto */
let itens = [];            // vindos do images.json
let edicoes = {};          // { "Pasta/foto.jpg": {name,phrase,year,link,tag,collection} }
let ordemTags = [];
let tagsVisiveis = 2;
let selecao = new Set();
let filtro = "";           // "" = todas | "__sem" = sem tag | nome da tag
let atual = null;          // item aberto no painel
let ultimaEdicao = 0;      // para saber se ha trabalho nao salvo
let ultimoSalvo = 0;
/* COLECOES (17/09/2026).
   `colecoesDef`: as criadas AQUI - e o que vai para o mix-info.json.
     `null` = este navegador nunca teve a lista; na primeira leitura ela
     e reconstruida do que o robo publicou (as marcadas `criada`). Mesma
     regra das edicoes: o navegador dela manda, o repositorio so semeia.
   `colecoesPub`: a lista como o robo publicou no images.json.
   `filtroCol`: a coleção que a grade esta mostrando ("" = todas). */
let colecoesDef = null;
let colecoesPub = [];
let filtroCol = "";

/* A chave vive numa gaveta propria: assim exportar, importar ou limpar
   as edicoes nunca arrasta o token junto por descuido. */
const lerToken = () => { try { return localStorage.getItem(CHAVE_TOKEN) || ""; } catch (e) { return ""; } };
const gravarToken = (t) => { try { t ? localStorage.setItem(CHAVE_TOKEN, t) : localStorage.removeItem(CHAVE_TOKEN); } catch (e) {} };

/* De onde salvar: sai do proprio link do JSON que ela ja colou.
   .../gh/USUARIO/REPO@BRANCH/images.json */
const donoDoRepo = () => {
  const m = /cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\//.exec($("url").value.trim());
  return m ? { dono: m[1], repo: m[2], branch: m[3] } : null;
};

/* base64 de texto com acento. `btoa` sozinho quebra em "ç" e "ã";
   e o spread do TextEncoder estoura a pilha num arquivo grande, por
   isso vai em blocos. */
const paraBase64 = (txt) => {
  const bytes = new TextEncoder().encode(txt);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
};

const mostrarEstado = (texto, tipo) => {
  const el = $("estado");
  if (!texto) { el.innerHTML = ""; el.className = "estado"; return; }
  el.className = "estado" + (tipo ? " " + tipo : "");
  el.innerHTML = (tipo === "indo" ? '<span class="girando"></span>' : "")
    + '<span>' + esc(texto) + '</span>';
};

const $ = (id) => document.getElementById(id);
let armazenaOk = true;
const salvar = () => {
  ultimaEdicao = Date.now();
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      url: $("url").value, edicoes, ordemTags, tagsVisiveis, colecoesDef
    }));
  } catch (e) {
    /* NAO PODE FALHAR CALADO.
       Antes isto era um catch vazio: se o navegador nao guardasse
       (janela anonima, armazenamento cheio, site bloqueado), a
       ferramenta seguia funcionando e ela podia perder duas horas de
       trabalho sem nunca ver um aviso. */
    if (armazenaOk) {
      armazenaOk = false;
      desenhar();
    }
  }
};

/* Aviso ao fechar com trabalho nao salvo. O navegador mostra o texto
   dele, nao o meu - o que importa e a pergunta existir. */
window.addEventListener("beforeunload", (e) => {
  if (temTrabalho() && ultimaEdicao > ultimoSalvo) {
    e.preventDefault(); e.returnValue = "";
  }
});

/* O caminho no repositorio e a CHAVE de tudo. Sai da propria URL do
   CDN: .../gh/user/repo@main/Pasta/foto.jpg -> "Pasta/foto.jpg" */
const caminhoDe = (u) => {
  const m = /cdn\.jsdelivr\.net\/gh\/[^/]+\/[^/]+@[^/]+\/(.+)$/.exec(u || "");
  if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
  return u || "";
};
const esc = (t) => String(t == null ? "" : t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* valor efetivo: o que ela editou vence o que veio do JSON */
/* VAZIO DE PROPOSITO vs SEM EDICAO - sao coisas diferentes.
   A versao anterior apagava a chave nos dois casos, e ai o `val` caia
   de volta no valor do images.json. Como o robo escreve uma tag para
   TODA foto, "tirar tag" restaurava a tag do robo no mesmo instante:
   o botao existia e nao fazia nada, sem erro nem aviso.
     null  = ela apagou de proposito  -> fica vazio
     ausente = ela nunca mexeu        -> vale o que veio do robo
   O gerar-mix.js ja trata null certo: `if (tag) item.tag = tag` deixa
   o campo de fora. */
const val = (it, campo) => {
  const e = edicoes[it.caminho] || {};
  return e[campo] !== undefined ? (e[campo] || "") : (it[campo] || "");
};
/* ---------- A INFO DO GRUPO ----------
   Sao TRES coisas diferentes, e eu tinha juntado duas:
     1. a info do GRUPO     -> aparece no CARD, junto da tag e do icone
     2. a info da CAPA      -> aparece na 1a pagina do carrossel
     3. a info de cada foto -> aparece na pagina dela
   A capa e uma foto como as outras. Antes o organizador usava o texto
   dela como se fosse o do grupo, e ai nao havia como dizer uma coisa no
   card e outra na primeira foto.
   A do grupo mora numa chave separada da lider (`grupo`), e enquanto ela
   estiver vazia o card continua herdando o texto da capa - que e como
   sempre foi, entao nada muda de aparencia sozinho. */
/* ---------- IDIOMA ----------
   O INGLES E O PADRAO e mora nos campos de sempre (`name`, `phrase`):
   assim tudo o que ja esta escrito continua valendo e nada precisa ser
   migrado. Portugues e espanhol entram em blocos ao lado, e so quando
   escritos.
   So o TEXTO tem idioma. Ano, link, tag e colecao sao os mesmos nos
   tres - um ano nao se traduz, e uma tag que mudasse de nome por idioma
   quebraria o filtro em duas listas diferentes. */
/* o codigo e o que vai para o arquivo; o nome e o que ela le */
const IDIOMAS = [["en", "Inglês"], ["pt", "Português"], ["es", "Espanhol"]];
let idioma = "en";

const valLingua = (it, campo) => {
  if (idioma === "en") return val(it, campo);
  const e = (edicoes[it.caminho] || {})[idioma] || {};
  if (e[campo] !== undefined) return e[campo] || "";
  const pub = (it[idioma] && typeof it[idioma] === "object") ? it[idioma] : {};
  return pub[campo] || "";
};
const editarLingua = (caminho, campo, valor) => {
  if (idioma === "en") { editar(caminho, campo, valor); return; }
  if (!edicoes[caminho]) edicoes[caminho] = {};
  const b = Object.assign({}, edicoes[caminho][idioma] || {});
  if (valor === "") delete b[campo]; else b[campo] = valor;
  if (Object.keys(b).length) edicoes[caminho][idioma] = b;
  else delete edicoes[caminho][idioma];
  if (!Object.keys(edicoes[caminho]).length) delete edicoes[caminho];
  salvar();
};

/* Interruptor da info. LIGADO e o padrao, entao a pergunta e sempre "foi
   desligado?" - e desligar so vale quando esta escrito. Vazio, `false` e
   ausente sao a mesma coisa: ligado. */
const desligada = (v) => v === true || v === "true";
/* Ligar de volta grava FALSE, e nao apaga a chave - mesma armadilha do
   arquivar: apagar faria o valor cair de volta no `true` que veio do
   images.json, e a info se esconderia sozinha de novo. */
const marcaInfo = (ligada) => (ligada ? false : true);

const valGrupo = (it, campo) => {
  const e = (edicoes[it.caminho] || {}).grupo || {};
  if (e[campo] !== undefined) return e[campo] || "";
  const pub = it.grupo || {};
  return pub[campo] || "";
};
const valGrupoLingua = (it, campo) => {
  if (idioma === "en") return valGrupo(it, campo);
  const g = ((edicoes[it.caminho] || {}).grupo || {})[idioma] || {};
  if (g[campo] !== undefined) return g[campo] || "";
  const pub = ((it.grupo || {})[idioma]) || {};
  return pub[campo] || "";
};
const editarGrupoLingua = (caminho, campo, valor) => {
  if (idioma === "en") { editarGrupo(caminho, campo, valor); return; }
  if (!edicoes[caminho]) edicoes[caminho] = {};
  const g = Object.assign({}, edicoes[caminho].grupo || {});
  const b = Object.assign({}, g[idioma] || {});
  if (valor === "") delete b[campo]; else b[campo] = valor;
  if (Object.keys(b).length) g[idioma] = b; else delete g[idioma];
  if (Object.keys(g).length) edicoes[caminho].grupo = g;
  else delete edicoes[caminho].grupo;
  if (!Object.keys(edicoes[caminho]).length) delete edicoes[caminho];
  salvar();
};

const editarGrupo = (caminho, campo, valor) => {
  if (!edicoes[caminho]) edicoes[caminho] = {};
  const g = Object.assign({}, edicoes[caminho].grupo || {});
  if (valor === "") delete g[campo]; else g[campo] = valor;
  if (Object.keys(g).length) edicoes[caminho].grupo = g;
  else delete edicoes[caminho].grupo;
  if (!Object.keys(edicoes[caminho]).length) delete edicoes[caminho];
  salvar();
};

const editar = (caminho, campo, valor) => {
  if (!edicoes[caminho]) edicoes[caminho] = {};
  /* "" vindo de um campo de texto = "volta ao padrao" (o nome do
     arquivo). `null` vindo de um botao = "vazio, de proposito". */
  if (valor === "") delete edicoes[caminho][campo];
  else edicoes[caminho][campo] = valor;
  if (!Object.keys(edicoes[caminho]).length) delete edicoes[caminho];
  salvar();
};

/* cdn.jsdelivr.net/gh/DONO/REPO@RAMO/arquivo -> raw.githubusercontent
   O `raw` revalida a cada poucos minutos e responde o commit de agora.
   Repo publico manda CORS liberado - por isso da para ler daqui. */
const semCdn = (u) => {
  const m = /^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.+)$/.exec(u);
  return m ? "https://raw.githubusercontent.com/" + m[1] + "/" + m[2] + "/" + m[3] + "/" + m[4] : "";
};

/* ---------- O MIX-INFO.JSON DO GITHUB: JUNTAR, NUNCA ATROPELAR ----------
   (19/09/2026) O RISCO que existia: o "Salvar" escrevia no GitHub SO o que
   estava neste navegador. Num navegador novo (ou com os dados apagados), o
   primeiro Salvar trocaria o mix-info.json inteiro por quase nada - textos,
   carrosseis, traducoes e colecoes sumiriam do site.

   Agora a ferramenta le o arquivo do GitHub ao ABRIR e de novo na hora de
   SALVAR, e junta com o daqui, foto por foto e colecao por colecao,
   comparando com a ultima versao que ESTE navegador viu la (a "base"):
     - so mudou aqui            -> vale o daqui
     - so mudou no GitHub       -> vale o do GitHub (outro navegador, outra maquina)
     - mudou nos dois, diferente -> vale o daqui, e ela e avisada
     - nunca vi o GitHub antes  -> soma: o daqui vence, o que falta vem de la
   Nada que so existe no GitHub e apagado por um navegador que nunca o viu. */
const CHAVE_BASE = "mix-organizador-base";
const lerBase = () => { try { return JSON.parse(localStorage.getItem(CHAVE_BASE) || "null"); } catch (e) { return null; } };
const gravarBase = (b) => { try { localStorage.setItem(CHAVE_BASE, JSON.stringify(b)); } catch (e) {} };
const ordenarChaves = (v) => {
  if (Array.isArray(v)) return v.map(ordenarChaves);
  if (v && typeof v === "object") {
    const o = {};
    Object.keys(v).sort().forEach((k) => { o[k] = ordenarChaves(v[k]); });
    return o;
  }
  return v;
};
const canon = (v) => (v === undefined ? "\u2205" : JSON.stringify(ordenarChaves(v)));
function juntar3(base, local, repo) {
  const out = {};
  let conflitos = 0, trazidos = 0;
  const L = local || {}, R = repo || {};
  const chaves = new Set([...Object.keys(base || {}), ...Object.keys(L), ...Object.keys(R)]);
  chaves.forEach((k) => {
    const l = L[k], r = R[k];
    const cl = canon(l), cr = canon(r);
    let v;
    if (cl === cr) v = l;
    else if (!base) { v = l !== undefined ? l : r; if (l === undefined) trazidos++; }
    else {
      const cb = canon(base[k]);
      if (cl === cb) { v = r; trazidos++; }
      else if (cr === cb) v = l;
      else { v = l !== undefined ? l : r; conflitos++; }
    }
    if (v !== undefined) out[k] = v;
  });
  return { out, conflitos, trazidos };
}
const deBase64 = (c) => {
  const bin = atob(String(c || "").replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};
const lerInfoTexto = (txt) => {
  const d = JSON.parse(txt || "{}");
  const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
  return { items: obj(d.items), collections: obj(d.collections) };
};
/* Com a chave: pela API (sempre o AGORA, e traz o `sha` para salvar).
   Sem a chave: pelo endereco publico do arquivo (pode atrasar uns minutos
   - por isso o Salvar le de novo, pela API, antes de escrever). */
async function lerInfoDoRepo(paraSalvar) {
  const alvo = donoDoRepo();
  if (!alvo) return null;
  const token = lerToken();
  if (token) {
    const r = await fetch("https://api.github.com/repos/" + alvo.dono + "/" + alvo.repo
      + "/contents/mix-info.json?ref=" + encodeURIComponent(alvo.branch) + "&t=" + Date.now(), {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28" },
      cache: "no-store",
    });
    if (r.status === 404) return { dados: { items: {}, collections: {} }, sha: null };
    if (r.status === 401) throw new Error("A chave não foi aceita. Clique em Salvar e cole uma nova.");
    if (r.status === 403) throw new Error("A chave não tem permissão de escrita em Contents.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    return { dados: lerInfoTexto(deBase64(j.content)), sha: j.sha };
  }
  if (paraSalvar) return null;
  const r = await fetch("https://raw.githubusercontent.com/" + alvo.dono + "/" + alvo.repo + "/"
    + alvo.branch + "/mix-info.json?t=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) return { dados: { items: {}, collections: {} } };
  if (!r.ok) return null;
  return { dados: lerInfoTexto(await r.text()) };
}
/* junta o do GitHub com o daqui; a base passa a ser o que o GitHub tem */
function sincronizar(repo) {
  const base = lerBase();
  const a = juntar3(base && base.items, edicoes, repo.items);
  const b = juntar3(base && base.collections, colecoesDef || {}, repo.collections);
  edicoes = a.out;
  if (colecoesDef !== null || Object.keys(b.out).length) colecoesDef = b.out;
  gravarBase({ items: repo.items, collections: repo.collections });
  return { trazidos: a.trazidos + b.trazidos, conflitos: a.conflitos + b.conflitos };
}
const resumoSync = (s) => (s.trazidos
  ? " · " + s.trazidos + (s.trazidos === 1 ? " mudança veio" : " mudanças vieram") + " do GitHub" : "")
  + (s.conflitos ? " · " + s.conflitos + (s.conflitos === 1 ? " foto editada" : " fotos editadas")
    + " aqui e lá: ficou a daqui" : "");

/* ---------- CARREGAR ---------- */
async function carregar() {
  const url = $("url").value.trim();
  if (!url) return;
  $("grade").innerHTML = '<div class="vazio">carregando…</div>';
  try {
    /* A FONTE DA VERDADE E O REPOSITORIO, NAO O CDN.
       MEDIDO em 31/08/2026: a MESMA url do jsDelivr devolveu 8 itens no
       navegador e 7 no terminal, no mesmo minuto. O `?t=` engana o cache
       do NAVEGADOR; a borda do jsDelivr guarda `@main` por horas e
       responde o que tem guardado. Foi por isso que o carrossel de
       Motion existia no repositorio e nao existia aqui - e sem o item,
       "Arquivadas" nunca teria o que mostrar.
       O SITE continua lendo o CDN, que e para isso que ele serve. A
       ferramenta nao pode: aqui ela precisa ver o AGORA. */
    let r = null, fonte = "";
    const direto = semCdn(url);
    if (direto) {
      try {
        const t = await fetch(direto, { cache: "no-store" });
        if (t.ok) { r = t; fonte = "repositorio"; }
      } catch (e) { /* repo privado, sem rede: cai no CDN abaixo */ }
    }
    if (!r) {
      r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(),
                      { cache: "no-store" });
      fonte = "CDN (pode estar atrasado)";
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const lista = Array.isArray(d) ? d : (d.items || d.itens || []);
    itens = lista.map((it, i) => {
      const img = it.image || it.imagem || "";
      const vid = it.video || "";
      return {
        i, image: img, video: vid,
        caminho: caminhoDe(vid || img),
        name: it.name || it.nome || "",
        phrase: it.phrase || it.frase || "",
        /* ano como TEXTO: "2024" e "2024 - 2025" tem que caber os dois */
        year: it.year === undefined || it.year === null
          ? (it.ano === undefined || it.ano === null ? "" : String(it.ano))
          : String(it.year),
        link: it.link || "",
        tag: it.tag || "",
        /* ARQUIVADA vinda do repositorio. Sem ler isto aqui, abrir a
           ferramenta noutro navegador mostraria tudo como nao-arquivado. */
        archived: it.archived === true || it.archived === "true",
        /* As paginas do carrossel como o robo as publicou. Depois que o
           robo roda, as seguidoras somem do images.json (viraram paginas
           de outro card) - sem ler isto aqui, abrir a ferramenta depois
           mostraria o carrossel como se fosse foto unica. */
        images: Array.isArray(it.images) ? it.images.slice() : [],
        /* A INFO DO GRUPO como o robo a publicou. Sem ler isto aqui,
           abrir a ferramenta noutro navegador mostraria os campos do
           grupo em branco enquanto o site mostra o texto. */
        grupo: (it.grupo && typeof it.grupo === "object") ? it.grupo : {},
        /* as traducoes como o robo as publicou */
        pt: (it.pt && typeof it.pt === "object") ? it.pt : {},
        es: (it.es && typeof it.es === "object") ? it.es : {},
        collection: it.collection || it.colecao || "",
        /* a LISTA, quando o robo a escreveu (so sai quando ela mexeu) */
        collections: Array.isArray(it.collections) ? it.collections.map(String) : null,
      };
    });
    /* AS COLECOES como o robo publicou. As `criada` semeiam a lista deste
       navegador SO se ele nunca teve uma - senao uma colecao que ela
       acabou de apagar voltaria sozinha ate o robo rodar. */
    colecoesPub = (Array.isArray(d.collections) ? d.collections : [])
      .map((c) => ({ name: String((c && (c.name || c.nome)) || "").trim(),
                     cover: (c && c.cover) || "", criada: !!(c && c.criada) }))
      .filter((c) => c.name);
    /* PRIMEIRO o mix-info.json do GitHub (ver "JUNTAR, NUNCA ATROPELAR").
       So se ele nao puder ser lido e que as colecoes criadas sao
       reconstruidas do images.json, como antes. */
    let sync = null;
    try {
      const lido = await lerInfoDoRepo(false);
      if (lido) sync = sincronizar(lido.dados);
    } catch (e) { /* sem rede ou sem permissao: segue com o daqui */ }
    if (colecoesDef === null) {
      colecoesDef = {};
      colecoesPub.forEach((c, i) => { if (c.criada) colecoesDef[c.name] = { order: 100 + i }; });
    }
    /* A ORDEM VEM DO REPOSITORIO, nao do navegador dela.
       Este era o ciclo: eu corrigia a ordem no mix-info.json, ela
       clicava em Salvar, e a ferramenta escrevia por cima com a ordem
       velha que estava guardada no navegador. O navegador dela era a
       fonte da verdade sem ninguem ter decidido isso.
       Agora o images.json manda - e ele ja carrega `tags`, escrito pelo
       robo. O navegador so acrescenta o que for novo. */
    if (Array.isArray(d.tags) && d.tags.length) {
      ordemTags = d.tags.map(String);
      if (typeof d.tagsVisiveis === "number") tagsVisiveis = d.tagsVisiveis;
    }

    /* A ORDEM DECLARADA NAO SE PERDE.
       Antes esta linha descartava toda tag que nao estivesse em uso
       naquele momento. Como no comeco so existia uma foto marcada, a
       ordem inteira que ela tinha definido foi jogada fora e
       reconstruida na ordem em que as tags apareceram nos dados.
       Agora a lista dela e preservada; tag que ainda nao tem foto
       aparece com contagem zero, e tag nova entra no fim. */
    const achadas = [...new Set(itens.map((x) => val(x, "tag")).filter(Boolean))];
    achadas.forEach((t) => { if (!ordemTags.includes(t)) ordemTags.push(t); });
    salvar(); desenhar();
    mostrarEstado("lido do " + fonte + (sync ? resumoSync(sync) : ""),
      fonte === "repositorio" && !(sync && sync.conflitos) ? "" : "aviso");
  } catch (e) {
    $("grade").innerHTML = '<div class="vazio">Não consegui ler.<br><br>' + esc(e.message)
      + '<br><br>Confira o link, e se o repositório é <strong>público</strong>.</div>';
  }
}


/* ---------- HELPERS DA GRADE E DO CARROSSEL ---------- */
function ativa(x) { return !ehArq(x) && !ehSeguidora(x); }
function contarTag(t) { return itens.filter((x) => ativa(x) && val(x, "tag") === t).length; }
function semTag() { return itens.filter((x) => ativa(x) && !val(x, "tag")).length; }
function contarArq() { return itens.filter(ehArq).length + arquivadasOrfas().length; }
function contarAtivas() { return itens.filter(ativa).length; }

/* Arquivada. `val` devolve "" quando o campo nao existe, entao basta
   comparar com true - e aceito "true" em texto porque um _info.json
   escrito na mao pode trazer assim. */
const ehArq = (it) => { const v = val(it, "archived"); return v === true || v === "true"; };

/* CARROSSEL. A lider guarda a lista ORDENADA das seguidoras
   (`carrossel`); cada seguidora guarda o caminho da lider
   (`carrosselDe`). A lista fica na lider porque a ORDEM das fotos e uma
   propriedade do card, nao de cada foto solta. */
const ehSeguidora = (it) => !!val(it, "carrosselDe");

/* Qual PAGINA do carrossel esta sendo editada. Clicar na miniatura
   seleciona para editar; virar capa e um botao a parte. Antes clicar
   virava capa direto - e ai nao havia como escrever o texto de uma
   pagina sem promove-la. */
let paginaSel = null;

/* Quais secoes do painel estao abertas. O painel se reconstroi inteiro a
   cada clique numa foto do carrossel: sem guardar isto, tudo fecharia e
   ela reabriria a mesma secao a cada foto.
   Comeca VAZIO: todas fechadas. O painel abre mostrando a foto e a lista
   do que existe, e ela abre so o que vai mexer. */
const abertas = new Set();

/* Reconstroi a URL de um caminho, tomando o prefixo do CDN de uma URL
   que ja temos. Precisa disto porque a seguidora pode nao existir mais
   na lista de itens - ela deixou de ser um card no images.json. */
const prefixoCdn = (u) => {
  const m = /^(https:\/\/cdn\.jsdelivr\.net\/gh\/[^/]+\/[^/]+@[^/]+\/)/.exec(u || "");
  return m ? m[1] : "";
};
const urlDe = (c, ref) => prefixoCdn(ref) + String(c).split("/").map(encodeURIComponent).join("/");

/* A SEQUENCIA do carrossel: capa primeiro, depois as paginas.
   Duas fontes, nesta ordem: a edicao local (o que ela acabou de montar)
   vence o que o robo publicou. */
function paginas(it) {
  const capa = { caminho: it.caminho, url: it.image || it.video };
  const local = grupo(it);
  if (local.length) {
    return [capa].concat(local.map((c) => {
      const f = itens.find((x) => x.caminho === c);
      return { caminho: c, url: f ? (f.image || f.video) : urlDe(c, capa.url) };
    }));
  }
  /* CADA PAGINA VEM COMO OBJETO, e nao mais como URL solta.
     O robo passou a escrever `{src,name,phrase}` para levar o texto de
     cada foto junto, e aqui continuava lendo como texto: `caminhoDe` de
     um objeto dava vazio, a miniatura ficava com src "[object Object]",
     e - o pior - o caminho nao batia com nenhum da lista, entao clicar
     numa pagina caia sempre na capa. Era esta a razao de "a info de
     cada imagem nao funciona": o campo existia e nunca era o da foto
     que ela tinha clicado.
     As duas formas seguem valendo: um images.json antigo ainda abre. */
  const pub = Array.isArray(it.images) ? it.images : [];
  /* A CAPA JA VEM NA LISTA quando o robo e novo. Sem esta conta ela
     entrava duas vezes - a tira mostrava 4 fotos num carrossel de 3, e a
     primeira aparecia repetida. So entra na frente quando nao veio, que
     e o caso do images.json antigo. */
  const primeiro = pub.length ? pub[0] : null;
  const srcPrimeiro = (primeiro && typeof primeiro === "object" && !Array.isArray(primeiro))
    ? String(primeiro.src || "") : String(primeiro || "");
  const capaJaNaLista = !!(srcPrimeiro && caminhoDe(srcPrimeiro) === capa.caminho);
  return (capaJaNaLista ? [] : [capa]).concat(pub.map((u) => {
    const obj = u && typeof u === "object" && !Array.isArray(u);
    const src = obj ? String(u.src || "") : String(u || "");
    return {
      caminho: caminhoDe(src), url: src,
      /* o texto JA PUBLICADO da pagina: e o que aparece no campo
         enquanto ela nao escrever nada por cima */
      name: obj ? (u.name || u.nome || "") : "",
      phrase: obj ? (u.phrase || u.frase || "") : "",
      /* o ano PROPRIO da pagina, para a faixa "2022–2026" */
      year: obj && u.year !== undefined && u.year !== null ? String(u.year) : "",
      /* as traducoes publicadas desta pagina, para o campo abrir com o
         que ja esta no ar em vez de em branco */
      pt: (obj && u.pt && typeof u.pt === "object") ? u.pt : {},
      es: (obj && u.es && typeof u.es === "object") ? u.es : {},
    };
  }));
}

/* Troca a capa: a escolhida vai para a frente e passa a liderar. */
function definirCapa(caminhoLider, novoCapa) {
  const it = itens.find((x) => x.caminho === caminhoLider);
  if (!it) return;
  const seq = paginas(it).map((p) => p.caminho);
  const i = seq.indexOf(novoCapa);
  if (i < 0 || i === 0) return;
  seq.splice(i, 1);
  seq.unshift(novoCapa);
  /* limpa TODAS antes de remontar: sem isto a lider antiga continuaria
     com a lista velha e a foto apareceria em dois carrosseis. */
  seq.forEach((c) => { editar(c, "carrossel", ""); editar(c, "carrosselDe", ""); });
  editar(seq[0], "carrossel", seq.slice(1));
  seq.slice(1).forEach((c) => editar(c, "carrosselDe", seq[0]));
  salvar(); desenhar();
  /* Depois que o robo publica, a seguidora some do images.json. Se a
     nova capa for uma dessas, nao ha item para reabrir - o painel
     ficaria sem dono. Melhor fechar de proposito. */
  if (itens.find((x) => x.caminho === seq[0])) abrirPainel(seq[0]);
  else fecharPainel();
}
const grupo = (it) => { const g = val(it, "carrossel"); return Array.isArray(g) ? g : []; };

/* ORFAS. Marcadas como arquivadas mas que ja NAO existem no
   images.json - o caso tipico e uma PAGINA de carrossel arquivada: ela
   deixou de ser item quando o robo rodou, e a marca ficou sem porta de
   volta (sumia da grade E de Arquivadas).
   Reconstruo o item a partir da propria edicao para que ela sempre
   apareca em algum lugar. Marca que nao se desfaz e armadilha. */
function arquivadasOrfas() {
  const ref = (itens[0] && (itens[0].image || itens[0].video)) || "";
  const fora = [];
  Object.keys(edicoes).forEach((c) => {
    const e = edicoes[c] || {};
    if (e.archived !== true && e.archived !== "true") return;
    if (itens.some((x) => x.caminho === c)) return;
    fora.push({
      i: -1, caminho: c, image: urlDe(c, ref), video: "",
      name: e.name || "", phrase: e.phrase || "", year: e.year || "",
      link: e.link || "", tag: e.tag || "",
      collection: e.collection || "", images: [], orfa: true,
    });
  });
  return fora;
}

/* Procura tambem entre as orfas: sem isto o painel nao abriria para
   elas, e desarquivar continuaria impossivel. */
function acharItem(caminho) {
  return itens.find((x) => x.caminho === caminho)
    || arquivadasOrfas().find((x) => x.caminho === caminho)
    || null;
}

/* ---------- COLECOES: a que colecoes cada foto pertence ----------
   (17/09/2026) Quatro fontes, da mais forte para a mais fraca:
     1. a lista que ela montou aqui (`collections` na edicao)
     2. o campo ANTIGO que este organizador gravava (`collection`, texto)
        - e que o robo ignorava em silencio. Vale como lista de um.
     3. a lista que o robo publicou
     4. a pasta onde a foto mora
   Lista vazia e escolha, nao falta: a foto fica so no All. */
const colecoesDe = (it) => {
  const e = edicoes[it.caminho] || {};
  if (Array.isArray(e.collections)) return e.collections.slice();
  if (typeof e.collection === "string" && e.collection) return [e.collection];
  if (Array.isArray(it.collections)) return it.collections.slice();
  return it.collection ? [it.collection] : [];
};
const mesmaLista = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
function definirColecoes(caminho, lista) {
  const it = acharItem(caminho);
  const limpa = [...new Set(lista.map((x) => String(x || "").trim()).filter(Boolean))];
  if (!edicoes[caminho]) edicoes[caminho] = {};
  delete edicoes[caminho].collection;
  /* Voltou a ser exatamente a pasta? Entao nao ha edicao nenhuma a
     guardar - o arquivo fica limpo, como se ela nunca tivesse mexido. */
  const padrao = it && !Array.isArray(it.collections) ? (it.collection ? [it.collection] : []) : null;
  if (padrao && mesmaLista(padrao, limpa)) delete edicoes[caminho].collections;
  else edicoes[caminho].collections = limpa;
  if (!Object.keys(edicoes[caminho]).length) delete edicoes[caminho];
  salvar();
}

/* TODAS as colecoes que existem: as do robo, as criadas aqui, e qualquer
   nome que alguma foto carregue. Uma criada aqui e depois APAGADA
   continua no images.json ate o robo rodar - ela sai da lista mesmo
   assim, senao apagar pareceria nao funcionar.

   A ORDEM (19/09/2026) - ela: "editar as ordens das colecoes". A ordem
   escrita aqui (`order` em `colecoesDef`) manda; sem ela, vale a posicao
   em que o robo publicou (que ja segue o mix.config.json). Ao mexer
   numa seta, TODAS as visiveis ganham um numero 1, 2, 3... - senao uma
   pasta sem numero empataria com uma com numero e o site desempataria
   pelo alfabeto, que nao e o que ela pediu.

   EXCLUIDAS - ela: "nunca exclui a imagem, somente a colecao". Uma
   PASTA nao some do GitHub (as fotos moram nela): ela ganha `oculta` e o
   robo tira do site. Fica numa lista propria, com "Restaurar". */
function ordemDaColecao(n) {
  const def = colecoesDef || {};
  if (def[n] && typeof def[n].order === "number") return def[n].order;
  const i = colecoesPub.findIndex((c) => c.name === n);
  return i >= 0 ? i + 1 : 999;
}
const ehOculta = (n) => !!(colecoesDef && colecoesDef[n] && colecoesDef[n].oculta);
function todasColecoes() {
  const def = colecoesDef || {};
  const pastas = new Set(colecoesPub.filter((c) => !c.criada).map((c) => c.name));
  const nomes = [];
  const add = (n) => { n = String(n || "").trim(); if (n && !nomes.includes(n)) nomes.push(n); };
  colecoesPub.forEach((c) => { if (!c.criada || def[c.name]) add(c.name); });
  Object.keys(def).forEach(add);
  itens.forEach((x) => { if (ativa(x)) colecoesDe(x).forEach(add); });
  return nomes
    .filter((n) => !ehOculta(n))
    .sort((a, b) => (ordemDaColecao(a) - ordemDaColecao(b)) || a.localeCompare(b))
    .map((n) => {
      const membros = itens.filter((x) => ativa(x) && colecoesDe(x).includes(n));
      const capa = membros.find((x) => x.image);
      return { nome: n, n: membros.length, capa: capa ? capa.image : "",
               pasta: pastas.has(n), criada: !!def[n] && !pastas.has(n) };
    });
}
/* as excluidas que ainda da para trazer de volta (as pastas) */
function colecoesOcultas() {
  const def = colecoesDef || {};
  return Object.keys(def).filter((n) => def[n] && def[n].oculta).sort();
}
function criarColecao(nome) {
  nome = String(nome || "").trim().replace(/\s+/g, " ");
  if (!nome) return "";
  /* nome repetido, com maiuscula diferente, seria outra colecao no site
     e a mesma na cabeca dela: devolve a que ja existe */
  const ja = todasColecoes().find((c) => c.nome.toLowerCase() === nome.toLowerCase());
  if (ja) return ja.nome;
  if (!colecoesDef) colecoesDef = {};
  /* uma PASTA excluida com o mesmo nome: criar e trazer de volta */
  const oculta = colecoesOcultas().find((n) => n.toLowerCase() === nome.toLowerCase());
  if (oculta) { restaurarColecao(oculta); return oculta; }
  /* nasce no FIM da lista, depois de todas as que ja existem */
  const ultima = todasColecoes().reduce((m, c) => Math.max(m, ordemDaColecao(c.nome)), 0);
  colecoesDef[nome] = { order: Math.max(100, ultima) + 1 };
  salvar();
  return nome;
}
/* EXCLUIR. Nunca toca em foto nenhuma.
   - criada aqui (ou que so existia dentro das fotos): some de vez, e as
     fotos saem dela - continuam no Mix, no All e nas outras colecoes
   - PASTA do GitHub: fica escondida do site (`oculta`) - a pasta e as
     fotos continuam no repositorio, e "Restaurar" traz tudo de volta */
function apagarColecao(nome) {
  const pasta = colecoesPub.some((c) => c.name === nome && !c.criada);
  if (!colecoesDef) colecoesDef = {};
  if (pasta) {
    colecoesDef[nome] = Object.assign({}, colecoesDef[nome] || {}, { oculta: true });
  } else {
    delete colecoesDef[nome];
    /* as fotos saem dela; as fotos em si nao sao tocadas */
    itens.forEach((x) => {
      const l = colecoesDe(x);
      if (l.includes(nome)) definirColecoes(x.caminho, l.filter((c) => c !== nome));
    });
  }
  if (filtroCol === nome) filtroCol = "";
  salvar();
}
function restaurarColecao(nome) {
  if (!colecoesDef || !colecoesDef[nome]) return;
  delete colecoesDef[nome].oculta;
  /* volta no fim da lista, onde ela vai ver que voltou */
  const ultima = todasColecoes().reduce((m, c) => Math.max(m, ordemDaColecao(c.nome)), 0);
  colecoesDef[nome].order = ultima + 1;
  salvar();
}
/* SOBE ou DESCE uma posicao, e numera todas as visiveis de novo */
function moverColecao(nome, passo) {
  const lista = todasColecoes().map((c) => c.nome);
  const i = lista.indexOf(nome), j = i + passo;
  if (i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  if (!colecoesDef) colecoesDef = {};
  lista.forEach((n, k) => {
    colecoesDef[n] = Object.assign({}, colecoesDef[n] || {}, { order: k + 1 });
  });
  salvar();
}
const temTrabalho = () => Object.keys(edicoes).length > 0
  || !!(colecoesDef && Object.keys(colecoesDef).length);

/* ---------- ANOS DE UM CARROSSEL ----------  (17/09/2026)
   O site passou a mostrar o intervalo das fotos: "2022–2026". Aqui o
   organizador faz a MESMA conta, para ela ver no card e no painel o que
   o site vai mostrar - antes de salvar. */
const ANO_RE = /\b(1[89]\d{2}|2\d{3})\b/g;
function faixaDeAnos(it) {
  const seq = paginas(it);
  if (seq.length < 2) return "";
  const textos = [valGrupo(it, "year")];
  seq.forEach((pg) => {
    const e = edicoes[pg.caminho] || {};
    const solta = itens.find((x) => x.caminho === pg.caminho);
    textos.push(e.year !== undefined ? e.year
      : (pg.year || (solta && pg.caminho !== it.caminho ? solta.year : "")));
  });
  const anos = [...new Set(textos.join(" ").match(ANO_RE) || [])].sort();
  if (!anos.length) return "";
  return anos[0] === anos[anos.length - 1] ? anos[0] : anos[0] + "–" + anos[anos.length - 1];
}


/* A ORDEM vem da grade, nao do Set: `selecao` nao guarda ordem, e a
   ordem aqui vira a ordem das fotos no carrossel. A primeira da grade
   e a capa. */
function selecionadasEmOrdem() {
  return itens.filter((x) => selecao.has(x.caminho));
}

function agruparCarrossel() {
  const sel = selecionadasEmOrdem();
  if (sel.length < 2) {
    mostrarEstado("selecione pelo menos duas fotos", "erro");
    return;
  }
  const lider = sel[0];
  const seguidoras = sel.slice(1);
  /* desfaz grupos anteriores das envolvidas antes de montar o novo,
     senao uma foto poderia ficar em dois carrosseis ao mesmo tempo */
  sel.forEach((x) => soltarGrupo(x.caminho));
  editar(lider.caminho, "carrossel", seguidoras.map((x) => x.caminho));
  seguidoras.forEach((x) => editar(x.caminho, "carrosselDe", lider.caminho));
  selecao.clear(); salvar(); desenhar();
  mostrarEstado("carrossel de " + sel.length + " fotos", "ok");
}

/* Solta o caminho de qualquer grupo, seja ele lider ou seguidora. */
function soltarGrupo(caminho) {
  const it = itens.find((x) => x.caminho === caminho);
  if (!it) return;
  grupo(it).forEach((c) => editar(c, "carrosselDe", ""));
  editar(caminho, "carrossel", "");
  const dono = val(it, "carrosselDe");
  if (dono) {
    const pai = itens.find((x) => x.caminho === dono);
    if (pai) editar(dono, "carrossel", grupo(pai).filter((c) => c !== caminho));
    editar(caminho, "carrosselDe", "");
  }
}

function desagrupar() {
  const sel = selecionadasEmOrdem();
  if (!sel.length) return;
  sel.forEach((x) => soltarGrupo(x.caminho));
  selecao.clear(); salvar(); desenhar();
  mostrarEstado("desagrupado", "ok");
}

function aplicarTag(t) {
  selecao.forEach((c) => editar(c, "tag", t));
  if (t && !ordemTags.includes(t)) ordemTags.push(t);
  selecao.clear(); salvar(); desenhar();
}


function estadoNaSelecao(nome) {
  const sel = [...selecao].map(acharItem).filter(Boolean);
  const n = sel.filter((x) => colecoesDe(x).includes(nome)).length;
  return !n ? "nenhuma" : (n === sel.length ? "todas" : "algumas");
}
function alternarNaSelecao(nome) {
  const sel = [...selecao].map(acharItem).filter(Boolean);
  const tirar = estadoNaSelecao(nome) === "todas";
  sel.forEach((x) => {
    const l = colecoesDe(x);
    definirColecoes(x.caminho, tirar ? l.filter((c) => c !== nome)
      : (l.includes(nome) ? l : l.concat([nome])));
  });
  mostrarEstado((tirar ? "tirado de " : "posto em ") + nome, "ok");
}
function desenharPopColecoes() {
  const lista = todasColecoes();
  $("popColecoes").innerHTML = '<div class="titulo">'
    + selecao.size + (selecao.size === 1 ? " foto" : " fotos") + ' · coleções</div>'
    + lista.map((c) => {
        const st = estadoNaSelecao(c.nome);
        return '<button class="opcao-col" data-col="' + esc(c.nome) + '" role="menuitemcheckbox"'
          + ' aria-checked="' + (st === "todas" ? "true" : st === "algumas" ? "mixed" : "false") + '">'
          + (c.capa ? '<img src="' + esc(c.capa) + '" alt="" loading="lazy">' : '<span class="sem-capa"></span>')
          + '<span class="nome">' + esc(c.nome) + '</span>'
          + '<span class="marca3 ' + st + '">' + (st === "todas" ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
              : st === "algumas" ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M5 12h14"/></svg>' : '')
          + '</span></button>';
      }).join("")
    + '<div class="criar-col"><input id="fNovaColPop" placeholder="Coleção nova" autocomplete="off" maxlength="60">'
    + '<button class="btn forte" id="btCriarColPop">Criar e pôr</button></div>';
  $("popColecoes").querySelectorAll("[data-col]").forEach((b) => {
    b.onclick = () => { alternarNaSelecao(b.dataset.col); desenharPopColecoes(); desenhar(); };
  });
  const criar = () => criarDoCampo("fNovaColPop", (nome) => { alternarNaSelecao(nome); desenharPopColecoes(); });
  $("btCriarColPop").onclick = criar;
  $("fNovaColPop").onkeydown = (e) => { if (e.key === "Enter") criar(); };
}
function abrirPopColecoes() {
  desenharPopColecoes();
  /* LOGO ACIMA DA BARRA, medida na hora. A barra quebra em duas ou tres
     linhas numa janela estreita (MEDIDO: ~170px de altura em 800px de
     largura), e um `bottom` fixo abria a lista por cima dela. */
  /* `offsetTop` e nao o retangulo: a barra ENTRA deslizando, e o
     retangulo inclui o deslize. Aberta no meio dele, a lista nasceria
     no lugar errado (MEDIDO no teste: 75px acima da barra). */
  const topoBarra = $("acoes").offsetTop;
  $("popColecoes").style.bottom = Math.max(16, innerHeight - topoBarra + 10) + "px";
  $("popColecoes").classList.add("on");
  $("btColAcao").setAttribute("aria-expanded", "true");
}
function fecharPopColecoes() {
  $("popColecoes").classList.remove("on");
  $("btColAcao").setAttribute("aria-expanded", "false");
}

/* ---------- PAINEL ---------- */

async function salvarNoGitHub() {
  const token = lerToken();
  if (!token) { abrirConfig(true); return; }
  const alvo = donoDoRepo();
  if (!alvo) {
    mostrarEstado("O link lá em cima não parece do jsDelivr", "erro");
    return;
  }
  const api = "https://api.github.com/repos/" + alvo.dono + "/" + alvo.repo
    + "/contents/mix-info.json";
  const cab = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
  };
  mostrarEstado("salvando…", "indo");

  /* `cache: "no-store"` na leitura (lerInfoDoRepo) NAO e detalhe: a API
     responde com `Cache-Control: private, max-age=60`, e salvando duas
     vezes seguidas a segunda receberia o sha VELHO do cache - o GitHub
     recusava com 409 sem ela ter feito nada de errado. */
  /* ANTES DE ESCREVER: le o que esta no GitHub AGORA e junta com o
     daqui. E isso que impede um navegador novo de apagar o que ele nao
     conhece. Devolve o `sha` - a trava do GitHub contra duas gravacoes
     se atropelarem. */
  let sync = null;
  const lerEJuntar = async () => {
    const lido = await lerInfoDoRepo(true);
    if (!lido) throw new Error("Não consegui ler o mix-info.json do GitHub.");
    sync = sincronizar(lido.dados);
    salvar();
    return lido.sha;
  };

  const gravar = async (sha) => {
    const corpo = {
      message: "mix-info.json pelo organizador",
      content: paraBase64(textoDoArquivo()),
      branch: alvo.branch,
    };
    if (sha) corpo.sha = sha;
    return fetch(api, { method: "PUT", headers: cab, cache: "no-store", body: JSON.stringify(corpo) });
  };

  try {
    let r = await gravar(await lerEJuntar());

    /* Uma segunda tentativa, automatica, com o sha buscado de novo.
       Quem escreve o mix-info.json e so ela, por esta ferramenta - o
       robo do repositorio nunca toca nele. Entao um conflito aqui e
       quase sempre a propria gravacao anterior dela, e mandar "recarregue
       a pagina" seria empurrar para a usuaria um problema que o codigo
       resolve sozinho. */
    if (r.status === 409 || r.status === 422) {
      mostrarEstado("ajustando…", "indo");
      r = await gravar(await lerEJuntar());
    }

    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { msg = (await r.json()).message || msg; } catch (e2) {}
      if (r.status === 409 || r.status === 422) {
        msg = "O arquivo mudou no GitHub. Recarregue a página e salve de novo.";
      }
      throw new Error(msg);
    }
    ultimoSalvo = Date.now();
    /* o que acabou de ser escrito e o que o GitHub tem agora */
    gravarBase(lerInfoTexto(textoDoArquivo()));
    desenhar();
    const n = Object.keys(edicoes).length;
    const nc = colecoesDef ? Object.keys(colecoesDef).length : 0;
    mostrarEstado("salvo · " + n + (n === 1 ? " foto" : " fotos")
      + (nc ? " · " + nc + (nc === 1 ? " coleção" : " coleções") : "")
      + " · o robô já está rodando" + (sync ? resumoSync(sync) : ""),
      sync && sync.conflitos ? "aviso" : "ok");
    setTimeout(() => mostrarEstado("salvo há pouco", "ok"), 6000);
  } catch (e) {
    mostrarEstado(String((e && e.message) || e), "erro");
  }
}

/* ---------- EXPORTAR ---------- */
function textoDoArquivo() {
  const saida = { tags: ordemTags, tagsVisiveis, items: {} };
  /* as colecoes criadas aqui - so entram no arquivo quando existem, para
     um mix-info.json sem colecao nenhuma continuar identico ao de antes */
  if (colecoesDef && Object.keys(colecoesDef).length) {
    saida.collections = {};
    Object.keys(colecoesDef).sort().forEach((c) => { saida.collections[c] = colecoesDef[c]; });
  }
  Object.keys(edicoes).sort().forEach((c) => { saida.items[c] = edicoes[c]; });
  return JSON.stringify(saida, null, 2) + "\n";
}

function exportar() {
  const txt = textoDoArquivo();
  ultimoSalvo = Date.now();
  mostrarEstado("baixado — agora suba o arquivo no repositório", "ok");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
  a.download = "mix-info.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- uma pergunta curta, com ou sem campo ----------
   Devolve o texto (ou true), ou null se ela desistir. Substitui o
   `prompt`/`confirm` do navegador, que não dá para explicar nem estilizar. */
function perguntar(titulo, texto, campo) {
  return new Promise((ok) => {
    $("pgTitulo").textContent = titulo;
    $("pgTexto").textContent = texto || "";
    $("pgCampo").hidden = !campo;
    $("pgInput").value = "";
    if (campo) $("pgInput").placeholder = campo.dica || "";
    $("pgSim").textContent = campo ? "Criar" : "Sim";
    $("veuPergunta").hidden = false;
    if (campo) setTimeout(() => $("pgInput").focus(), 30);
    const fim = (v) => {
      $("veuPergunta").hidden = true;
      $("pgSim").onclick = $("pgNao").onclick = $("pgInput").onkeydown = null;
      ok(v);
    };
    $("pgSim").onclick = () => fim(campo ? ($("pgInput").value.trim() || null) : true);
    $("pgNao").onclick = () => fim(null);
    $("veuPergunta").onclick = (e) => { if (e.target === $("veuPergunta")) fim(null); };
    $("pgInput").onkeydown = (e) => {
      if (e.key === "Enter") fim($("pgInput").value.trim() || null);
      if (e.key === "Escape") fim(null);
    };
  });
}

function posicao(alvo) {
  if (alvo && typeof alvo.clientX === "number") return { x: alvo.clientX, y: alvo.clientY };
  const r = alvo.getBoundingClientRect();
  return { x: r.left, y: r.bottom + 6 };
}
function fecharMenu() { if (menuAberto) { menuAberto.remove(); menuAberto = null; } }
function abrirMenu(alvo, itens) {
  fecharMenu();
  const p = posicao(alvo);
  const m = document.createElement("div");
  m.className = "menu";
  m.innerHTML = itens.map((i) => i === "-" ? '<div class="risco"></div>'
    : '<button' + (i.perigo ? ' class="perigo"' : "") + ' data-i="' + i.id + '">' + esc(i.rotulo) + '</button>').join("");
  document.body.appendChild(m);
  m.style.left = Math.max(8, Math.min(p.x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(p.y, innerHeight - m.offsetHeight - 8)) + "px";
  menuAberto = m;
  m.querySelectorAll("[data-i]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const acao = itens.find((i) => i !== "-" && i.id === b.dataset.i);
      fecharMenu();
      if (acao && acao.faz) acao.faz();
    };
  });
}

function menuDaTag(nome, alvo) {

    { id: "sobe", rotulo: "Subir", faz: () => {

    { id: "desce", rotulo: "Descer", faz: () => {

    "-",

        if (filtro === nome) filtro = "";
        salvar(); desenhar();
        mostrarEstado("tag “" + nome + "” excluída", "ok");
