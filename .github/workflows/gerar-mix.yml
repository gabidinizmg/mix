name: Gerar images.json

# Roda sozinho a cada arquivo que voce sobe.
# `paths-ignore` evita o ciclo do robo se disparar com o proprio commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'images.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar o images.json
        run: node .github/gerar-mix.js

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --staged --quiet || git commit -m "images.json atualizado automaticamente"
          git push
